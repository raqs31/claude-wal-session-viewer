name: Release

# A published GitHub Release publishes its tag to npmjs and GitHub Packages. A bare tag push
# publishes nothing. To publish an existing tag again, run this workflow by hand on that tag.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Each registry rejects a version it already has, so one registry failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - registry: https://registry.npmjs.org
            token: NPM_TOKEN
          - registry: https://npm.pkg.github.com
            token: GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Scoped, so `npm ci` still resolves dependencies from npmjs.
          scope: '@raqs31'
          registry-url: ${{ matrix.registry }}
          package-manager-cache: false
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::run on tag $version, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.token] }}
