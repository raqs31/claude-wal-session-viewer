      /* Each colour token holds its light and dark value; data-theme on the root forces one of them. */
:root {
  color-scheme: light dark;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --bg: light-dark(#f7f9fc, #0f172a);
  --lane: light-dark(#eef2f8, #131d33);
  --surface: light-dark(#ffffff, #162033);
  --box: light-dark(rgb(255 255 255 / 0.7), rgb(255 255 255 / 0.025));
  --ink: light-dark(#1e293b, #e2e8f0);
  --muted: light-dark(#576579, #94a3b8);
  --faint: light-dark(#94a3b8, #64748b);
  --line: light-dark(#e2e8f0, #243049);
  --line-strong: light-dark(#cbd5e1, #334155);
  --edge-base: light-dark(#94a3b8, #64748b);
  --ring: light-dark(#4f46e5, #a5b4fc);
  --link: light-dark(#2563eb, #93c5fd);
  --code-bg: light-dark(#f1f5f9, #1e293b);
}

:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

/* A status element carries --fill, --stroke and --text from the vocabulary. The light theme shows
   them as they are. The dark theme tints the deep surface mostly with the stroke: the pastel fills
   alone mix into near-equal greys there, and the bit of fill keeps dark fills apart from grey ones. */
.st {
  --st-bg: light-dark(
    var(--fill),
    color-mix(in srgb, var(--stroke) 25%, color-mix(in srgb, var(--fill) 15%, var(--surface)))
  );
  --st-line: light-dark(
    color-mix(in srgb, var(--stroke) 70%, var(--fill)),
    color-mix(in srgb, var(--stroke) 60%, var(--surface))
  );
  --st-ink: light-dark(var(--text), #f8fafc);
}

[hidden] {
  display: none !important;
}

body {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr) auto;
  height: 100vh;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
}

:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

code {
  font-family: var(--mono);
  font-size: 12px;
}

/* header */

header {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1.75rem;
  padding: 0.75rem 1.5rem;
  border-bottom: 1px solid var(--line);
}

.title {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
}

h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}

.total,
.count {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

.total {
  color: var(--muted);
  font-size: 12px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 1rem;
  color: var(--muted);
  font-size: 12px;
}

.legend .status,
.legend .shape {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
}

.legend .none .swatch {
  opacity: 0.4;
}

.count {
  color: var(--ink);
}

.swatch {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--st-bg);
  box-shadow: inset 0 0 0 1px var(--st-line);
}

.legend .sep {
  align-self: stretch;
  width: 1px;
  background: var(--line);
}

.shape-icon polygon,
.shape-icon rect {
  fill: none;
  stroke: var(--muted);
  stroke-width: 1;
}

.theme {
  margin-left: auto;
  padding: 0.25rem 0.625rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: none;
  color: var(--muted);
  font: 12px var(--sans);
  cursor: pointer;
}

.theme:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

/* graph */

main {
  overflow: auto;
  min-width: 0;
}

svg.graph {
  display: block;
  min-width: 100%;
  min-height: 100%;
}

.band {
  fill: transparent;
}

.band.odd {
  fill: var(--lane);
}

.band-rule {
  stroke: var(--line);
  stroke-width: 1;
}

.phase-label,
.box-header text,
.badge text,
.node .id {
  font-family: var(--mono);
}

/* The labels stay at the left edge while the graph scrolls, so they may pass over edges and
   nodes: the stroke in the lane colour keeps them readable. */
.phase-label {
  fill: var(--muted);
  font-size: 12px;
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 6px;
  stroke-linejoin: round;
}

.phase-label.odd {
  stroke: var(--lane);
}

.box {
  fill: var(--box);
  stroke: var(--line-strong);
  stroke-width: 1;
}

.box-header,
.badge,
.node {
  cursor: pointer;
  outline: none;
}

.box-header .ring,
.badge .ring {
  fill: none;
  stroke: var(--ring);
  stroke-width: 2;
  stroke-opacity: 0;
}

.box-header:focus-visible .ring,
.badge:focus-visible .ring {
  stroke-opacity: 1;
}

.box-header text,
.badge text {
  fill: var(--muted);
  font-size: 11px;
}

.box-header:hover text,
.badge:hover text {
  fill: var(--ink);
}

.badge .face {
  fill: var(--surface);
  stroke: var(--line-strong);
  stroke-width: 1;
  stroke-dasharray: 3 3;
}

.node {
  color: var(--st-ink);
}

.node .shape {
  fill: var(--st-bg);
  stroke: var(--st-line);
  stroke-width: 1;
}

.node:hover .shape {
  stroke-width: 1.75;
}

.node .ring {
  fill: none;
  stroke: var(--ring);
  stroke-width: 2;
  opacity: 0;
}

.node.selected .ring,
.node:focus-visible .ring {
  opacity: 1;
}

.node text {
  fill: currentColor;
}

.node .id {
  font-size: 12px;
  font-weight: 500;
  fill-opacity: 0.8;
}

.node .label {
  font-size: 13px;
  font-weight: 600;
}

.node .tag rect {
  fill: currentColor;
  fill-opacity: 0.07;
}

.node .tag circle,
.chip.tag::before {
  fill: light-dark(hsl(var(--hue) 60% 45%), hsl(var(--hue) 65% 70%));
  background: light-dark(hsl(var(--hue) 60% 45%), hsl(var(--hue) 65% 70%));
}

.node .tag text {
  font-size: 11px;
  fill-opacity: 0.9;
}

.edge {
  fill: none;
  stroke: color-mix(in oklab, var(--c) 55%, var(--edge-base));
  stroke-width: 1.25;
  stroke-dasharray: 5 4;
  animation: flow 1s linear infinite;
}

.arrow {
  fill: color-mix(in oklab, var(--c) 55%, var(--edge-base));
}

@keyframes flow {
  to {
    stroke-dashoffset: -9;
  }
}

@media (prefers-reduced-motion: reduce) {
  .edge {
    animation: none;
  }
}

.connector {
  fill: none;
  stroke: var(--faint);
  stroke-width: 1;
  stroke-dasharray: 1 3;
}

/* chips */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0 0.5rem;
  border-radius: 999px;
  font-size: 11.5px;
  line-height: 18px;
  white-space: nowrap;
}

.chip.st {
  background: var(--st-bg);
  box-shadow: inset 0 0 0 1px var(--st-line);
  color: var(--st-ink);
}

.chip.tag {
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--muted);
}

.chip.tag::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

/* hover preview */

#preview {
  position: fixed;
  z-index: 20;
  max-width: 22rem;
  padding: 0.625rem 0.75rem;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
  font-size: 12px;
  line-height: 1.5;
  pointer-events: none;
}

.preview-head {
  display: flex;
  gap: 0.5rem;
  align-items: baseline;
  margin-bottom: 0.25rem;
}

.preview-head code {
  color: var(--muted);
}

#preview .meta {
  margin-top: 0.25rem;
  color: var(--muted);
}

#preview p {
  margin: 0.375rem 0 0;
}

/* drawer */

#drawer {
  grid-row: 2;
  grid-column: 2;
  width: min(34rem, 92vw);
  box-sizing: border-box;
  overflow-y: auto;
  padding: 0 1.5rem 2rem;
  border-left: 1px solid var(--line);
  background: var(--surface);
}

@media (max-width: 40rem) {
  #drawer {
    grid-column: 1 / -1;
    width: auto;
  }
}

.drawer-head {
  position: sticky;
  top: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0.625rem;
  margin: 0 -1.5rem;
  padding: 1rem 3rem 0.875rem 1.5rem;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

.drawer-id {
  color: var(--muted);
  font-size: 13px;
}

.drawer-head h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.close {
  position: absolute;
  top: 0.625rem;
  right: 0.875rem;
  padding: 0 0.375rem;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--muted);
  font-size: 20px;
  line-height: 1.4;
  cursor: pointer;
}

.close:hover {
  color: var(--ink);
}

#drawer dl {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 0.375rem 1rem;
  margin: 1.25rem 0;
  font-size: 13px;
}

#drawer dt {
  color: var(--muted);
}

#drawer dd {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 0.5rem;
  min-width: 0;
  margin: 0;
  overflow-wrap: anywhere;
}

.link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--link);
  font: 12px var(--mono);
  cursor: pointer;
}

.link:hover,
#drawer a:hover {
  text-decoration: underline;
}

#drawer a {
  color: var(--link);
  text-decoration: none;
}

#drawer h3 {
  margin: 1.5rem 0 0.375rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
}

.md {
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.md p,
.md ul,
.md ol,
.md pre,
.md table,
.md blockquote {
  margin: 0.5rem 0;
}

.md ul,
.md ol {
  padding-left: 1.25rem;
}

.md :not(pre) > code {
  padding: 0.0625rem 0.3125rem;
  border-radius: 4px;
  background: var(--code-bg);
}

.md pre {
  overflow-x: auto;
  padding: 0.625rem 0.75rem;
  border-radius: 6px;
  background: var(--code-bg);
}

.md table {
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

.md th,
.md td {
  padding: 0.25rem 0.5rem;
  border: 1px solid var(--line);
}

.md blockquote {
  padding-left: 0.75rem;
  border-left: 2px solid var(--line-strong);
  color: var(--muted);
}

a coordinator. Never for breadth alone."}, "sections": ["Goal", "Non-goals", "Context", "Comments", "Follow-ups", "Result"], "tickets": {"T1": {"verify": "node --test scripts/target.test.ts && npm run check && npm run lint", "depends_on": [], "sections": {"Goal": "Add `scripts/target.ts`, the one module that owns the target file contract (plan.md Phase 1 §1), and `scripts/target.test.ts` (Phase 1 §2).", "Non-goals": "- No observer, no reader switch, no server change. Nothing calls the module yet.\n- No record kinds beyond plan.md \"Implementation Approach\" step 1.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, read \"Implementation Approach\" step 1, \"Critical Implementation Details\" (Torn tail, Single writer) and Phase 1.\n\nContract (copied from plan.md Phase 1 §1):\n- `targetDir(source)` → `\u003cconfig-dir>/wal-viewer`. `targetPath(source, id)` → `\u003cdir>/\u003cid>.jsonl`.\n- `TargetRecord`: a discriminated union on `k`, covering every kind in \"Implementation Approach\" step 1 (`head`, `ev`, `call`, `tok`, `use`, `turn`, `compact`, `agent`, `tools`, `cost`, `ck`, `stale`). `TARGET_VERSION = 1`. `k` is the first key of every serialized record. `ev` writes `rec` (or `raw`) as its last key; `call` writes `input` then `response` as its last keys (\"Search text\").\n- `appendRecords(file, records)`: writes whole lines in batches of at most 64 KB, like `appendLines` (`scripts/legacy.ts:25`). It writes a leading `\\n` when the file ends mid-line.\n- `createTargetReader(file)`: an incremental tail with `{ino, offset, carry}`. It returns the new records with their `off` / `len` in the target. It reports a shrink or new inode, and it skips unparseable lines.\n- `acquireLock(dir)` / `releaseLock`: `\u003cdir>/observer.lock`, holds the pid, created with `O_EXCL`. A lock whose pid is dead is replaced. Returns `false` when a live pid holds the lock.\n\nTests: `node --test` on a temp dir, no server. Cases: append, the torn tail, incremental read across a partial line, shrink and new inode detection, lock held / dead pid / released. Pattern for a temp-dir test: `scripts/legacy.test.ts`.\n\nDo not commit; the orchestrator commits each phase after its review.", "Comments": "- 2026-10-26 14:58 orchestrator: status todo → in_progress\n- 2026-10-26 15:00 worker T1: status in_progress → done\n- 2026-10-26 15:04 orchestrator: status done → in_progress\n- 2026-10-26 15:04 orchestrator: T2 review follow-ups to fix now (all four): see T2 Follow-ups - lock dead-pid take race (target.ts:205-213), releaseLock pid check (:218), ev type exactly one of rec/raw (:43-44), reader partial-line buffer bound (:174). Re-run verify, then close done.\n- 2026-10-26 15:05 worker T1: status in_progress → done", "Follow-ups": "", "Result": "Landed:\n- scripts/target.ts:10-18 TARGET_VERSION, targetDir / targetPath (config dir = dirname of source.projectsDir)\n- scripts/target.ts:20-60 Pos, EvBase and the TargetRecord union (head, ev, call, tok x2, use, turn, compact, agent, tools, cost, ck, stale). Follow-up 3: `ev` is now two members, `rec` or `raw`, never both or neither (:44-47)\n- scripts/target.ts:78-116 serialize (k first; rec/raw and input/response last) and appendRecords (64 KB batches, leading \\n on a torn tail, creates the dir)\n- scripts/target.ts:118-186 createTargetReader: {items:{rec,off,len}[], reset}, skips unparseable lines. Follow-up 4: the carry is copied with Buffer.from (:177)\n- scripts/target.ts:188-253 lock. Follow-up 1: acquireLock writes the pid to a private file and hard-links it to observer.lock (never empty), replaces a dead pid's lock by renaming it aside and checking the moved pid, and reads the pid back (:210-248). Follow-up 2: releaseLock removes the lock only when it holds process.pid (:250-253)\n- scripts/target.test.ts:1-177 ten node:test cases on a temp dir; new: no leftover files after a dead-lock takeover (:151), release leaves another pid's lock (:170)\n\nCheck: `node --test scripts/target.test.ts && npm run check && npm run lint` exit 0 (10 tests pass; tsc clean; biome ci: no errors).\n\nDecisions:\n- Reader on a shrink or new inode returns `reset: true` and re-reads from byte 0 in the same call (like the index tail), so the caller drops what it built.\n- Line `off`/`len` exclude the trailing `\\n`, as `IndexEntry` does.\n- `call.mcp` is a boolean (MCP tool or not); the plan lists the key without a type, and a call row has no request/response role.\n- `ev.woff` is `number | null` and `ev.out?: number` exists: the plan's no-WAL turn rows have no WAL offset and carry `out` inline.\n- `ck.wal` is `Pos | null` for a session without a WAL. `use` is `{k:'use'} & UsageRecord`.\n- `tok` is two union members: `{tuid, out, res?}` and `{woff, out}`.\n- The reader also skips a parseable line with no string `k`.\n- `acquireLock` and `appendRecords` create the dir. A lock file with no valid pid counts as dead.\n- The dead-lock takeover still has a small window if two servers race it. If the renamed file holds a different pid than the one read, the lock is put back and acquire returns false. A race gives false (no observer), not two holders.\n- Follow-up 3 has no runtime test: it is a type-level change, checked by `npm run check`.\n- Follow-up 4 has no new test: the partial-line read test covers the carry path.\n\nOpen: none."}}, "T2": {"verify": "npm run check && npm run lint && npm test", "depends_on": ["T1"], "sections": {"Goal": "Check that T1 meets its Goal and plan.md Phase 1 (Target format, writer, reader, lock), progress items 1.1-1.3.", "Non-goals": "- Later phases' behaviour; nothing calls the module yet.", "Context": "Decisions to hold the work to: scope is plan.md phases 1-8; out of scope are discovery, `/sessions`, the trash flow, `wal legacy`, the hook and version bumps. The record shapes must match plan.md \"Implementation Approach\" step 1 and \"Search text\" key order, because every later phase builds on them.", "Comments": "- 2026-10-26 15:00 orchestrator: sta The dead-pid case now also checks for no leftover files (scripts/target.test.ts:164).\nCheck: npm run check && npm run lint && npm test — exit 0; node --test 210 pass, 0 fail, 0 skipped; wal-hook.test.sh \"all checks passed\"."}}, "T3": {"verify": "node --test scripts/observer.test.ts && npm run check && npm run lint", "depends_on": ["T1"], "sections": {"Goal": "Add `scripts/observer.ts`: per session it reads the WAL from the checkpoint and appends `head`, `ev`, `call` and `ck` records to the target, resumes after a restart and freezes a changed source (plan.md Phase 2 §1). Add `scripts/observer.test.ts` with the Phase 2 §2 cases.", "Non-goals": "- No transcript records (Phase 3), no `tok` records (Phase 6), no background loop or lock use (Phase 5).\n- No change to `scripts/wal-index.ts`: the readers switch in Phase 4. Copy the derivation, do not move it yet.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, read \"Implementation Approach\" steps 1-2, \"Critical Implementation Details\" (Torn tail, Replay must not write) and Phase 2.\n\nBuild on T1: `scripts/target.ts` (`targetPath`, `TargetRecord`, `TARGET_VERSION`, `appendRecords`, `createTargetReader`).\n\nContract (copied from plan.md Phase 2 §1):\n- `createObserver({discovery, write: boolean})` gives `sync(id, budgetMs)` → `{done, total, stale}`, where done / total are WAL bytes. It also gives `state(id)` and `drop(id)`.\n- The per-line derivation comes from `indexLine` (`scripts/wal-index.ts:129`): `t`, event, cat, tool, `dur`, `tuid`, agent, agentType, mcp, err. An unparseable line takes the previous `t`, else the time of the pass, and the observer persists it. `day` / `minute` are not stored (they depend on the server time zone).\n- `ev` holds the derived fields, the WAL byte offset `woff`, and `rec` (parsed WAL record) as last key; unparseable lines hold `raw` instead.\n- `call`: one per tool call, written when its Post / PostFailure is read: `tuid`, `t` (Pre `ts`, else Post `ts`), `end` (Post `ts`), `dur`, `tool`, `mcp`, `err`, `agent`, `agentType`, `input` and `response` (`tool_response`, else `error`), `input` then `response` last.\n- The open-Pre map has the same cap as `pending` today (`PENDING_MAX = 10_000`, `scripts/wal-index.ts:12`). A Post with no Pre gives a call row with `t = end`. A second Post for the same `tuid` gives no second call row.\n- Restart: read the target, take the last `ck`, replay the WAL to `ck.wal.off` without writing, then continue.\n- Stale: a WAL smaller than `ck.wal.off`, a new inode, or a `head.v` other than `TARGET_VERSION` appends `stale {reason}` once and stops all writes for that target.\n- A WAL that does not exist (for example, in trash) is skipped; that does not make the target stale.\n- The WAL path is `\u003cdir>/\u003cid>.wal.jsonl` beside the transcript (`scripts/discovery.ts:323`); get the session through `discovery.locate`.\n\nTests (plan.md Phase 2 §2), over temp WALs: `ev` fields match today's `IndexEntry` for the same lines; a call row for a plain tool, an MCP tool and a failure; Post with no Pre; a duplicate Post; unparseable lines keep `raw` and a persisted `t`; resume in a new observer instance writes no duplicates; shrink and new inode give `stale` and no further writes; a torn target tail; a budget of 0 ms makes partial progress and later passes finish.\n\nDo not commit; the orchestrator commits each phase after its review.", "Comments": "- 2026-10-26 15:06 orchestrator: status todo → in_progress\n- 2026-10-26 15:13 worker T3: status in_progress → done\n- 2026-10-26 15:18 orchestrator: status done → in_progress\n- 2026-10-26 15:18 orchestrator: T4 review follow-ups to fix now: 1 (empty target frozen when WAL replaced before first complete line), 3 (called set never shrinks), 4 (ENOENT between stat and open - skip), 5 (read-only reset re-reads whole target), 6 (tests for version stale, missing-WAL skip, write:false). Follow-up 2 moves to T8; do not fix it here. See T4 Follow-ups for lines.\n- 2026-10-26 15:20 worker T3: status in_progress → done\n- 2026-10-26 15:22 orchestrator: status done → in_progress\n- 2026-10-26 15:22 orchestrator: T4 blocker (round 2): capped called set re-writes call rows after restart - observer.ts:182 re-adds old ids during replay before the woff \u003c replayTo return at :184, evicting newer ids. Fix: for lines before the last checkpoint return before touching called. Add a test (repro: /tmp/t4rev/cap.test.ts, 10005 calls + 3, cut ck, new observer -> duplicates). See T4 Result.\n- 2026-10-26 15:23 worker T3: status in_progress → done", "Follow-ups": "- 2026-10-26 15:13 worker T3: scripts/wal-index.ts:169 MCP_ROLE[rec.event] and shared/api.ts:27 OF[ev] are plain-object lookups, so an event named e.g. 'constructor' hits Object.prototype; observer.ts uses a Map instead.", "Result": "Landed:\n- scripts/observer.ts:11-19 MCP_ROLE (a Map), PENDING_MAX = 10_000 (caps the open-Pre map and the called set), CHUNK = 64 KB (the budget is checked once per chunk)\n- scripts/observer.ts:35-67 SyncResult {done, total, stale} and the per-session state (WAL ino/off, replayTo, redo map, open-Pre map, called set)\n- scripts/observer.ts:69-74 capped: drops the oldest key past PENDING_MAX (T4 follow-up 3)\n- scripts/observer.ts:86 fresh takes an optional reader; scripts/observer.ts:261-264 a read-only reset keeps the reader that already restarted from byte 0 (T4 follow-up 5)\n- scripts/observer.ts:104-122 absorb: reads the target for head version, last ck (ino, off, last ev t), the call tuids (capped), the post-ck evs and stale\n- scripts/observer.ts:131-201 per-line derivation copied from indexLine (t, event, cat, tool, dur, tuid, agent, agentType, mcp, err, woff, rec or raw), then the open-Pre map and the call row at Post / PostFailure. T4 blocker round 2: a Post before the last ck closes its open Pre and returns before it touches `called` (:178-186)\n- scripts/observer.ts:204-239 pass: whole lines from the WAL offset, until the WAL end or the deadline; null on ENOENT at open (T4 follow-up 4, :210-215)\n- scripts/observer.ts:243-296 sync: locate, skip a missing session or WAL, stale checks (format version, wal replaced, wal shrank); a replaced or shrunk WAL with no head yet starts over (:271-277, T4 follow-up 1); ino is taken after a pass that read the WAL (:283); append head (first time) + records + ck\n- scripts/observer.ts:299-311 state(id), drop(id), return {sync, state, drop}\n- scripts/observer.test.ts:1-377 fifteen node:test cases: ev vs IndexEntry (:43), call rows plain / MCP / failure (:90), Post with no Pre (:129), duplicate Post (:139), unparseable raw + persisted t (:154), resume (:176), shrink (:198), new inode (:214), torn tail (:231), budget 0 ms (:252), WAL replaced before its first whole line (:276), format version (:293), missing WAL skip (:306), write:false (:331), regression for the blocker: 10 005 calls + 3, torn ck, new observer, no duplicate call rows (:359)\n\nCheck: `node --test scripts/observer.test.ts && npm run check && npm run lint` exit 0 (15 tests pass; tsc clean; biome ci: 103 files, no fixes). The regression test fails on the old order (10 011 call rows, expected 10 008) and passes with the fix.\n\nDecisions:\n- `discovery` is typed `Pick\u003cDiscovery, 'locate'>`; the target path is `targetPath({label: '', projectsDir: dirname(dir)}, id)` (targetDir reads only projectsDir, and dir = projectsDir/slug).\n- `write: false` never appends: each sync re-reads the target incrementally and reports done = last ck.wal.off, total = WAL size, stale from the target. A target reset restarts its state with the same reader.\n- Replay is part of the budgeted pass: lines below ck.wal.off update the open-Pre map only and write nothing. `done` = max(read offset, ck.wal.off).\n- Crash between records and ck: `ev`s after the last ck are kept in a woff→t map and not written again (their persisted t is reused); call tuids already in the target are loaded into `called` by absorb, and replayed lines no longer touch it.\n- The first line after the replay takes the last persisted ev `t` before the ck as its fallback.\n- call: dur = the Post's duration_ms; input = Pre tool_input, else the Post's tool_input, else null; response = tool_response ?? error ?? null; err = PostToolUseFailure for any tool.\n- ev.event is null for a missing or non-string event; tool / tuid / agent / agentType are null unless non-empty strings.\n- Stale reasons: `wal shrank`, `wal replaced`, `format version \u003cv>`. A stale record is appended once.\n- Follow-up 1: a target with no head holds nothing built from the old WAL, so a replaced or shrunk WAL resets the in-memory state and builds from the new file.\n- Follow-up 3: the called set uses the open-Pre cap (10 000). Trade-off: a duplicate Post more than 10 000 calls after the first one gives a second row.\n- Follow-up 4: the ENOENT race has no test; it cannot be timed in a test.\n- Follow-up 5 is checked by behaviour only (the reset case in the write:false test).\n- head is written with the first records of the first pass that has any; an empty WAL writes nothing.\n- On an append error the in-memory state is dropped, so the next sync re-opens from what reached the disk.\n\nOpen: T4 follow-up 2 (unbudgeted first read of the target) is moved to T8 per the coordinator; not touched here."}}, "T4": {"verify": "npm run check && npm run lint && npm test", "depends_on": ["T3"], "sections": {"Goal": "Check that T3 meets its Goal and plan.md Phase 2 (Observer — WAL to target), progress items 2.1-2.3.", "Non-goals": "- Transcript records, tokens, the loop: later phases.", "Context": "Decisions to hold the work to: scope is plan.md phases 1-8; out of scope are discovery, `/sessions`, the trash flow, `wal legacy`, the hook and version bumps; the viewer never writes a WAL. Check \"Replay must not write\" and \"Torn tail\" in plan.md \"Critical Implementation Details\", and that `ev` fields match today's `indexLine` derivation (`scripts/wal-index.ts:129`).", "Comments": "- 2026-10-26 15:14 orchestrator: status todo → in_progress\n- 2026-10-26 15:18 reviewer T4: status in_progress → done\n- 2026-10-26 15:20 orchestrator: status done → in_progress\n- 2026-10-26 15:22 reviewer T4: status in_progress → blocked\n- 2026-10-26 15:24 orchestrator: status blocked → in_progress\n- 2026-10-26 15:24 reviewer T4: status in_progress → done", "Follow-ups": "- 2026-10-26 15:18 reviewer T4: minor: scripts/observer.ts:254 — ino is recorded before anything is written; a WAL replaced while it holds no whole line freezes an empty target: 'stale' becomes line 1 with no head, the session's lines are never written (reproduced ad hoc) (owner: T3)\n- 2026-10-26 15:18 reviewer T4: minor: scripts/observer.ts:236 — the first sync parses the whole target in one unbudgeted read() with every item in memory, so a cold sync of a large target ignores budgetMs; decide in Phase 5 (loop pre-open or a streaming absorb) (owner: T3)\n- 2026-10-26 15:18 reviewer T4: minor: scripts/observer.ts:65 — 'called' keeps every call tuid for the life of the session state, unbounded unlike the open-Pre map's PENDING_MAX (owner: T3)\n- 2026-10-26 15:18 reviewer T4: minor: scripts/observer.ts:197 — openSync throws ENOENT when the WAL moves (trash) between statSync and the read; the missing-WAL skip holds only outside that race (owner: T3)\n- 2026-10-26 15:18 reviewer T4: minor: scripts/observer.ts:243 — on a read-only reset a new reader is made but the items came from the old one, so the next sync re-reads the whole target (idempotent, extra I/O) (owner: T3)\n- 2026-10-26 15:18 reviewer T4: minor: scripts/observer.test.ts — no test for version stale, the missing-WAL skip or write:false (T3 Open); an ad-hoc check of all three passed (owner: T3)", "Result": "Verdict: approve\nFindings: none open. The round-2 blocker is resolved.\n- scripts/observer.ts:181-183 — a Post below ck.wal.off now returns before it touches `called`, so the replay no longer evicts the tuids that absorb loaded. Regression test: scripts/observer.test.ts:359 (10 008 unique call rows after a torn ck past the cap). (owner: T3)\n- Earlier fixes stay confirmed: follow-ups 1, 4, 5 and 6. Follow-up 2 is moved to T8 and not counted.\nCheck: npm run check && npm run lint && npm test — exit 0 (tsc clean; biome ci 103 files; node --test 225 pass, 0 fail, 0 skipped; wal-hook.test.sh all checks passed). The ad-hoc repro of the blocker now passes (0 duplicate call rows), and the earlier edge checks pass (5/5)."}}, "T5": {"verify": "node --test scripts/observer.test.ts scripts/session-view.test.ts scripts/target.test.ts && npm run check && npm run lint", "depends_on": ["T3"], "sections": {"Goal": "Extend `scripts/observer.ts` with the transcript pass (plan.md Phase 3 §1): `use`, `turn`, `compact`, `agent`, `tools`, `cost` records and `ck.tr`, plus call and turn rows for a session without a WAL. Add the Phase 3 §4 cases to `scripts/observer.test.ts`.", "Non-goals": "- No `scripts/session-view.ts` (T6 builds it), no reader switch, no `tok` records.\n- No change to `scripts/transcripts.ts` outputs; use `createParser` as it is.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, read \"Implementation Approach\" step 1-2, \"Sessions without a WAL\" and Phase 3 §1 and §4.\n\nBuild on T3 (`scripts/observer.ts`) and T1 (`scripts/target.ts` record types).\n\nContract (copied from plan.md Phase 3 §1):\n- Per session, run today's `createParser` (`scripts/transcripts.ts:115`) on the main transcript and on each subagent transcript that has a `.meta.json`. Append the records that changed since the last pass.\n- `use`: one per reply, keyed by (agent, id). It holds the `UsageRecord` fields (`scripts/transcripts.ts:39`). It is appended when the value differs from the last one written.\n- `turn`: main turn starts. `compact`: per agent.\n- `agent`: id, type, description, model, toolUseId, parent, prompt. It is re-appended when the parent or type resolves later.\n- `tools` `{agent, n}` 7 Follow-ups.\n- 2026-10-26 15:45 worker T5: Follow-up 1 (touched) fixed at scripts/observer.ts:462 with a test at scripts/observer.test.ts:538. Follow-up 2 (cost turning null) needs files outside T5: target.ts:70 types cost.usd as number, and session-view.ts:45 turns any cost record into a non-null cost. Expected: a cost record that shows null. Found: no record shape for it (target.ts:70). Why this matters: writing usd null fails tsc, and session-view.ts would report {total: null} instead of null.\n- 2026-10-26 15:45 worker T5: status in_progress → blocked\n- 2026-10-26 15:46 planner: status blocked → todo\n- 2026-10-26 15:46 orchestrator: status todo → in_progress\n- 2026-10-26 15:48 worker T5: status in_progress → done", "Follow-ups": "- 2026-10-26 15:36 worker T5: A read-only observer (write:false) still skips a session with no WAL, so it reports no stale for a no-WAL target; Phase 5 may want it (scripts/observer.ts:603).\n- 2026-10-26 15:36 worker T5: Transcript reads are not budgeted: the first sync of a long session parses its whole transcripts at once, as the store does today; Phase 5 adds transcript bytes to progress.", "Result": "Landed:\n- scripts/observer.ts:1-5 header: a pass reads transcripts first, then the WAL; no-WAL sessions get rows from transcripts\n- scripts/observer.ts:24-25 MAIN, AGENT_RE; :52-80 AgentMeta and the per-transcript state (parser, ino/off/replayTo, grew, rows state: open tool_use map, stopped replies, last command line)\n- scripts/observer.ts:82-123 Session gains wal (head.wal), tr (main first), ckTr, trRedo and `written` (keyed records as JSON, counts of turn/compact)\n- scripts/observer.ts:143-175 lines(): the whole-line reader factored out of the T3 WAL pass, shared by WAL and transcripts\n- scripts/observer.ts:178-196 headOf(): reads line 1 of a target only\n- scripts/observer.ts:224-259 absorb: head.wal, transcript ev uuids (trRedo), use/agent/tools/compact/turn/cost bookkeeping, ck.tr; ck with wal null handled\n- scripts/observer.ts:342-430 turnRow, callRow, trLine: no-WAL call rows and UserPromptSubmit / Stop / SubagentStop rows\n- scripts/observer.ts:432-505 transcript(), grow() (stale `transcript replaced` / `transcript shrank`), spawnOf(), discover() (copied from createStore, spawner first, spawn turn as sessions.ts:83)\n- scripts/observer.ts:508-565 changes(): use, turn, compact, tools, agent, cost records, appended only when changed\n- scripts/observer.ts:567-589 transcripts() and walPass()\n- scripts/observer.ts:591-670 sync: missing-WAL rule, `wal appeared`, transcripts then WAL, head.wal, ck {wal | null, tr}\n- scripts/observer.test.ts:36-51 fixtures copied to the temp HOME; locate finds the dir that holds `\u003cid>.jsonl`; session() also returns the transcript path\n- scripts/observer.test.ts:401-417 fixture helpers; :418 call rows main + subagent (t, end, dur, agent, agentType, input, response, head.wal false, one row per resulted tool_use); :469 turn rows (UserPromptSubmit = parser turnStarts, subagent first prompt, Stop / SubagentStop = end_turn lines with out, snapshot gives no Stop); :521 `wal appeared`\n\nCheck: `node --test scripts/observer.test.ts && npm run check && npm run lint` exit 0 (18 tests pass, 15 old + 3 new; tsc clean; biome ci 103 files, no fixes). Also a scratch probe outside the repo (/tmp/t5scratch/probe.ts) on all 4 fixture sessions: a second observer instance appends nothing, and a torn last ck writes no duplicate.\n\nDecisions:\n- Missing WAL: a target with head.wal true (in memory, or line 1 read by headOf) is skipped as in T3; only a session with no target or head.wal false is built from transcripts. Read-only mode skips a missing WAL as before.\n- Replay: the parsers always re-read each transcript from byte 0. Keyed records diff against what absorb read from the whole target, so nothing is written twice. Rows from lines below ck.tr off are not written; rows after it are deduped by trRedo (transcript line uuid) and `called`.\n- ck.tr holds only transcripts with off > 0, and a transcript's ino is kept only once bytes are read; so an empty transcript gives `tr: {}` (T3 assertion kept) and a replace before its first line is not stale.\n- Stale reasons `transcript replaced` / `transcript shrank`. With no head yet, the session starts over instead (as the WAL rule).\n- One Stop / SubagentStop per reply (message.id), at its first end_turn line: in 309 real transcripts, 204 of 603 end_turn replies span several end_turn lines, all with the same output_tokens. `out` = that line's usage.output_tokens.\n- A main turn that a reply starts (slash command) takes the last `\u003ccommand-` user line as `rec`; t = the parser's turnStart.\n- No-WAL call rows: err = tool_result is_error === true; results are `tool_result` blocks in user lines and any `tool_use_id` block in assistant lines (server tools), as the parser reads them. The Agent tool gets a call row too.\n- A row time with a missing timestamp falls back to the pass time (not persisted).\n- Records are emitted only for transcripts that grew this pass (a new agent counts as grown); `tools` is written only when n differs from the last one (default 0), `cost` only when costUsd is not null. T6 must treat a missing `tools` as 0.\n- Agent records come after all transcripts are read, because parent is looked up across all agents (sessions.ts:195).\n- When the WAL vanishes between stat and open, the session's in-memory state is dropped (the pass's transcript records are not written); the next sync re-opens from the target.\n\n\nRework (T7 follow-ups):\n- Landed: scripts/observer.ts:461-462 grow() clears parser.touched after each read, as sessions.ts:61 does. scripts/observer.test.ts:538 test: spies Set.prototype.add and asserts every set that took a parser item is empty after a sync; it fails with the clear removed (checked in this run) and passes with it.\n- Check: `node --test scripts/observer.test.ts && npm run check && npm run lint` exit 0 (19 tests pass; tsc clean; biome ci 105 files, no fixes). `node --test scripts/session-view.test.ts` exit 0 (6 tests pass).\n- Decision: the test spies Set.prototype.add because the observer does not expose its parsers and this Node (v24.20.0) has no mock.module without a flag.\n\n\nRework 2 (T7 follow-up 2, replan 2026-10-26):\n- Landed: scripts/target.ts:70-71 the cost record allows `usd: null`. scripts/observer.ts:558-559 writes a cost record when costUsd is not null, or when a cost record was already written, and its JSON differs. scripts/session-view.ts:45 sets `d.cost = null` for a record with usd null. Tests: scripts/observer.test.ts:558 (a cost-state with no total before any cost writes nothing; after a 1.5 cost, a later one with no total appends `{usd: null, byModel: {}}` once) and scripts/session-view.test.ts:78 (a cost record, then one with usd null: recordedCostUsd null, usage recorded null, missing 1). Both tests fail with the old lines (checked in this run) and pass now.\n- Check: `node --test scripts/observer.test.ts scripts/session-view.test.ts scripts/target.test.ts && npm run check && npm run lint` exit 0 (37 tests pass; tsc clean; biome ci 105 files, no fixes).\n- Decision: the before-first clause is asserted inside the observer cost test, not in a test of its own.\n\nOpen: none."}}, "T6": {"verify": "node --test scripts/session-view.test.ts && npm run check && npm run lint", "depends_on": ["T5"], "sections": {"Goal": "Add `scripts/session-view.ts`, which builds `SessionView`, `AgentStat` and `UsageTotals` from target transcript records (plan.md Phase 3 §2), and `scripts/session-view.test.ts`, a golden test that these equal today's store output for every fixture session (Phase 3 §3).", "Non-goals": "- No change to `scripts/sessions.ts` or the server: the store switches in Phase 4.\n- No `scripts/make-fixture.ts` changes.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, Phase 3 §2-§3.\n\nBuild on T5 (transcript records written by `scripts/observer.ts`) and T1 (`scripts/target.ts`: `TargetRecord`, `createTargetReader`).\n\nContract (copied from plan.md Phase 3 §2):\n- Build `SessionView`, `AgentStat` and `UsageTotals` from transcript records, with the same rules as `scripts/sessions.ts:148-202` (`records` at `:148`, the view at `:190` calling `aggregate` from `scripts/transcripts.ts:308`, usage totals at `:207`).\n- `context` is the last `use` record in first-appearance order per key, the same as file order today.\n- `recordedCostUsd` comes from `cost`.\n- Same exported shapes as `shared/api.ts` (`AgentStat` `:206`, `SessionView` `:219`, `UsageTotals` `:236`).\n\nGolden test (Phase 3 §3): for every fixture session in `scripts/fixtures/projects/`, build a target with the observer. Assert that the target-based view deep-equals today's `store.view` (`createStore`, `scripts/sessions.ts:43`) for scopes `all`, `main` and each agent, and that `usage` matches. Fixtures are copied to a temp `HOME` as they are, with no WAL.\n\nDo not commit; the orchestrator commits each phase after its review.", "Comments": "- 2026-10-26 15:36 orchestrator: status todo → in_progress\n- 2026-10-26 15:39 worker T6: status in_progress → done", "Follow-ups": "- 2026-10-26 15:39 worker T6: Agent order can differ for nested agents: sessions.ts:69 discovers in readdir order, observer.ts:490-498 reads the spawner first, and session-view.ts orders agents by their first agent record. The fixtures have one subagent, so the golden test cannot see it.", "Result": "Landed:\n- scripts/session-view.ts:14-25 SessionData (use: agent → reply id → UsageRecord, turnStarts, compacts, agents, tools, cost) and createSessionData\n- scripts/session-view.ts:28-47 absorb(d, records): folds use / turn / compact / agent / tools / cost records and skips all other kinds; a use record replaces its key's value in place, so its position stays where the key first appeared\n- scripts/session-view.ts:49-57 records(): main first, then agents in the order their agent record first appeared, as [main, ...agents] in sessions.ts:148\n- scripts/session-view.ts:59-87 recorded() from `cost` (model suffix stripped as sessions.ts:151) and agentStat() (missing `tools` counts as 0)\n- scripts/session-view.ts:89-101 view(d, {id, gen, version}, scope): SessionView, or null for an agent scope with no agent record\n- scripts/session-view.ts:103-115 usage(ds, unknown): UsageTotals\n- scripts/session-view.test.ts:19-47 fixtures copied as they are to a temp HOME (no WAL), real createDiscovery, createStore and an observer with write true; fromTarget syncs and asserts not stale\n- scripts/session-view.test.ts:49-76 a guard that the fixtures hold 4 sessions and a subagent; per session deepEqual of the view for all, main and each agent, plus usage([d]); usage over the whole pick with unknown ['x']\n\nCheck: `node --test scripts/session-view.test.ts && npm run check && npm run lint` exit 0 (6 tests pass; tsc clean; biome ci 105 files, no fixes).\n\nDecisions:\n- id, gen and version are store state, not target data, so view() takes them from the caller as `head`. Phase 4 supplies them.\n- Incremental API (createSessionData + absorb), so Phase 4 can feed records from createTargetReader as it tails. absorb does not handle a reader reset: the caller starts a new SessionData.\n- pricing.json is loaded again in session-view.ts, because sessions.ts does not export it and is outside files.\n- view() returns the stored AgentInfo objects, not copies.\n\nOpen: none. One follow-up filed (agent order for nested agents)."}}, "T7": {"verify": "npm run check && npm run lint && npm test", "depends_on": ["T5", "T6"], "sections": {"Goal": "Check that T5 and T6 meet their Goals and plan.md Phase 3 (Observer — transcripts to target), progress items 3.1-3.3.", "Non-goals": "- The reader switch and the token join: later phases.", "Context": "Decisions to hold the work to: scope is plan.md phases 1-8; out of scope are discovery, `/sessions`, the trash flow, `wal legacy`, the hook and version bumps. The golden test must compare against today's `store.view` unchanged; `scripts/transcripts.ts` outputs must not change. Check \"Sessions without a WAL\" in plan.md.", "Comments": "- 2026-10-26 15:39 orchestrator: status todo → in_progress\n- 2026-10-26 15:43 reviewer T7: status in_progress → done\n- 2026-10-26 15:48 orchestrator: status done → in_progress\n- 2026-10-26 15:49 reviewer T7: status in_progress → done", "Follow-ups": "- 2026-10-26 15:43 reviewer T7: minor: scripts/observer.ts:391 — parser.touched is never cleared (sessions.ts:61 clears it); with keepItems false it holds every reply and result item, so observer memory grows with each transcript (owner: T5)\n- 2026-10-26 15:43 reviewer T7: minor: scripts/observer.ts:556 — cost is written only while costUsd is not null; a later cost-state without totalCostUSD gives null in the store (transcripts.ts:250) but the target keeps the old cost (owner: T5)\n- 2026-10-26 15:43 reviewer T7: minor: scripts/session-view.ts:53 — agent order is spawner first (observer.ts:490-498), the store uses readdir order (sessions.ts:69); nested agents list in a different order and the golden test cannot see it; recommended: keep the plan's spawner-first order and say so in Phase 4 (owner: T6)", "Result": "Verdict: approve\nFindings: none open. Re-review after one fix round on T5:\n- Follow-up 1 is resolved. scripts/observer.ts:461-462 clears parser.touched after each read, as sessions.ts:61 does. scripts/observer.test.ts:538 asserts that every set holding a parser item is empty after a sync.\n- Follow-up 2 is resolved. scripts/target.ts:70-71 allows cost usd null. scripts/observer.ts:558-559 writes a null cost only to replace a written one. scripts/session-view.ts:45 maps it to a null cost, which equals the store (sessions.ts:153, :210). Tests: scripts/observer.test.ts:558 and scripts/session-view.test.ts:78. On restart, absorb loads the null record into written.cost, so it is not written again.\n- Follow-up 3 (agent order for nested agents) is settled by the orchestrator: spawner first stays, and T8 carries it. It is not counted against T6.\n- T5 meets Phase 3 §1 and §4, and T6 meets §2 and §3. Tests only add cases. scripts/transcripts.ts and scripts/sessions.ts have no diff.\n- Probe outside the repo (/tmp/t7probe/probe.ts), run again on the fixed code: the fixtures fed line by line with syncs and observer restarts give a view and usage equal to the store for every scope, with 0 diffs. The ev and call rows equal a single-pass build.\nCheck: npm run check && npm run lint && npm test, exit 0 (node tests 237 pass, 0 fail, 0 skipped; wal-hook.test.sh all checks passed)"}}, "T8": {"verify": "npx vite build --logLevel warn && node --test scripts/query.test.ts scripts/live-tail.test.ts scripts/sessions.test.ts scripts/usage.test.ts scripts/trash.test.ts scripts/discovery.test.ts && npm run check && npm run lint && ! grep -nE '\\.wal\\.jsonl|subagents|createParser' scripts/wal-index.ts scripts/sessions.ts scripts/wal-server.ts", "depends_on": ["T5", "T6"], "sections": {"Goal": "The Events index, the Sessions store and the server routes read only targets; each request first syncs its sessions within a budget; the old raw-read paths go (plan.md Phase 4 §1-§4). Then run manual check 4.4 on a copy of real data: Events and Sessions show the same numbers as the `main` build for a session with a WAL, apart from the planned differences below.", "Non-goals": "- No background loop, lock, `/observer` or `/rebuild` (Phase 5). No `tok` handling (Phase 6).\n- No change to `scripts/discovery.ts`, `scripts/trash.ts`, `scripts/legacy.ts`, `/sessions` or the hook.", "Context": "Why coupled: the index, the store and the server change their constructor contracts together (both get the observer and target paths), `shared/api.ts` gains `Pipe`, and the tests only run end to end through the server. The split puts the `shared/api.ts` and constructor contract first.\n\nPlan: `.ai/changes/wal-observer-pipeline/plan.md`, read Phase 4 in full, \"Search text\", \"Call row order\" and \"Single writer\".\n\nBuild on: T3/T5 `scripts/observer.ts` (`createObserver({discovery, write})`, `sync(id, budgetMs)` → `{done, total, stale}`, `state(id)`, `drop(id)`), T6 `scripts/session-view.ts`, T1 `scripts/target.ts` (`createTargetReader`, `targetPath`).\n\nContract (copied from plan.md Phase 4):\n- §1 `scripts/wal-index.ts`: `tail()` (`:207`) reads the target through `createTargetReader` instead of the WAL. Each `ev` and `call` record becomes an entry. The virtual MCP pairing and the per-line derivation (`indexLine`, `:129`) are removed. The read-time tree state (`agents`, `parents`, `about`, `links`) stays. `IndexEntry` (`:42`) keeps its fields, and `off` / `len` now point into the target. A call row has event `MCP call` for an MCP tool, else `Tool call`; its cat follows the Post's cat. `day` / `minute` are derived from `t` at read time. `q` reads the source part of the target line, as in \"Search text\". `createIndexes` (`:303`) keys indexes by target path.\n- §2 `scripts/sessions.ts`: the store keeps its API (`get`, `view`, `usage`, `drop`) but reads target records through `session-view.ts`; its parsers move into the observer. `version` is the target offset of the last transcript record read, so WAL rows do not resend views; it also changes when `pipe.stale` is set. `gen` changes when the store re-opens the target.\n- §3 server: routes call `observer.sync(id, budget)` for their sessions before they read. `walTick` (`scripts/wal-server.ts:137`) and `sessionTick` (`:101`) sync their streamed sessions before they read. `/record` (`:329`) reads the target; for a call row it returns the call record plus the Pre and Post `rec` found by `tuid`. The trash `forget` callback (`:116`) drops the reader state on trash and restore; purge also deletes the target. `shared/api.ts` gains `Pipe = {done: number; total: number; stale: string | null}`; `FirstPage` (`:78`) gains `pipe: Record\u003cstring, Pipe>` for the picked sessions, and `SessionView` gains `pipe`. The budget is 150 ms per request, shared by its sessions; the env `WAL_SYNC_BUDGET_MS` overrides it for tests only. When a streamed session's target turns stale, `/events-stream` sends `event: stale` with `{sess, reason}` once and no `reset`; `/session-stream` and `/usage-stream` carry it in `pipe.stale` of the next frame. `RecordResponse` (`:107`) keeps its shape for `ev` rows; for call rows it uses the same `{pre, post}` shape that virtual rows use today, plus `call`.\n- In this phase the server runs the observer with `write: true` and no lock; Phase 5 adds the lock.\n- §4 tests: existing tests pass with only these expected changes: every tool call has a call row, which replaces the MCP-only virtual row in counts and seqs; fixture sessions without a WAL now have call and turn rows in Events; a truncated or renamed WAL (`scripts/live-tail.test.ts:247-297`) gives `event: stale` and frozen rows, not `reset`; a deleted WAL leaves the rows and sends nothing; a truncated transcript (`scripts/sessions.test.ts:343-351`) gives `pipe.stale` in the next frame, not a higher `gen`. New cases: a no-WAL session gives call and turn rows and its stats equal today's; with `WAL_SYNC_BUDGET_MS=0` a first page is partial with `pipe.done \u003c pipe.total` and a later page is complete; trash, restore and purge keep, resume and delete the target. `scripts/bench-sessions.ts:213` builds the store directly: give it an observer so `npm run check` passes.\n\nManual check 4.4, on a copy of real data, never in the real `~/.claude`: copy a few real sessions with a WAL (`~/.claude/projects/\u003cproj>/\u003cid>.jsonl`, `\u003cid>.wal.jsonl` and `\u003cid>/subagents/`) into a temp `HOME`. Run the `main` build (for example `git archive main | tar -x -C \u003ctmp>` with `node_modules` linked) and this branch on that `HOME`, on two ports. Compare `/events` `total` and `counts` and `/session` / `/usage` JSON per session. Report the differences in the Result; the only allowed ones are the call rows listed above. Put anything you could not check under `Open:` as an item for the user.\n\nDo not commit; the orchestrator commits each phase after its review.", "Comments": "- 2026-10-26 15:18 orchestrator: Carried in from phase 2: (a) T4 follow-up 2 - observer first sync reads the whole target at once and ignores budgetMs (observer.ts ~:236); make the budgeted sync cover it. (b) T3 follow-up - wal-index.ts:169 and shared/api.ts:27 look up events in plain objects, so a prototype key like 'constructor' matches wrongly; use Object.hasOwn or a Map.\n- 2026-10-26 15:44 orchestrator: Decision from T7: nested agents list spawner first (session-view.ts:53), not the store's readdir order; this is intended. Manual check 4.4 must expect it.\n- 2026-10-26 15:49 orchestrator: status todo → in_progress\n- 2026-10-26 16:03 coordinator T8: Added scripts/observer.test.ts and scripts/session-view.test.ts to files: the Phase 4 contract breaks both (old createWalIndex and createStore calls). Needed so T8 verify passes. Also accepted: optional pipe fields, call-row cat fail>mcp>tool, purge deletes targets by source label.\n- 2026-10-26 16:32 coordinator T8: status in_progress → done", "Follow-ups": "", "Result": "Landed:\n- shared/api.ts:27-143,265-278 Pipe, StaleFrame, CallRecord, CallOnlyRecord (virtual?: undefined so web/ type-checks), FirstPage/SessionView/UsageTotals pipe, catOf with Object.hasOwn.\n- scripts/observer.ts:45,80-83,177,272-285,634-653,721-760 budgeted first absorb (write mode), Observer, targetFile, Targets, pipeOf, syncBudget, syncAll.\n- scripts/wal-index.ts:95-318 tail() over createTargetReader, call rows, createIndexes(targets) keyed by target path; scripts/sessions.ts:32-93 store over session-view with pipe.\n- scripts/wal-server.ts:75-78,128,175-181,209-213,261-276,333-435 observer write:true, sync before reads, event: stale, /record call rows, purge deletes the target.\n- Tests: query, live-tail, sessions, usage, trash, observer, session-view; bench-sessions.ts uses an observer.\nCheck:\n- T8 verify (vite build, 6 node --test files, npm run check, npm run lint, no-raw-read grep): exit 0. T8.9 also ran 8 test files: 88 pass, 0 fail.\n- Fit: createStore, createIndexes, syncAll, pipeOf, targetFile used as written in server, store, index and bench; scripts/trash.ts, discovery.ts, legacy.ts untouched.\n- Manual 4.4 on 5 copied real sessions in a temp HOME, main vs branch: non-call Events rows, /session (9 scopes) and /usage identical. Only planned diffs: Events total 1183 -> 1430 (call rows), counts.tool/fail up, counts.mcp loses failed MCP calls, pipe/version.\nDecisions:\n- Added scripts/observer.test.ts and scripts/session-view.test.ts to T8 files (old createWalIndex/createStore calls broke); expectations frozen from a git archive HEAD copy.\n- Call row cat: fail if failed, else mcp for MCP tool, else tool.\n- Purge reads trash.list() first, then deletes targets by source label in wal-server.ts; trash.ts untouched.\n- SessionView.pipe and UsageTotals.pipe are optional (session-view.ts is outside files).\n- First-absorb also completes in one call on a torn tail; blank WAL_SYNC_BUDGET_MS means unset.\n- Carried items done: budgeted first sync (test in query.test.ts, WAL_SYNC_BUDGET_MS=0), prototype-key lookup.\nOpen:\n- For the user: web UI and live-session check not done (HTTP JSON only).\n- For the user: no real session had an agent nested under an agent; spawner-first order is tested only in sessions.test.ts.\n- For the user: first page of a cold server can show partial total with pipe.done \u003c total; check the UI shows it as intended.\n- Note: T9 files list lacks scripts/observer.test.ts and scripts/session-view.test.ts."}}, "T8.1": {"verify": "node --test scripts/observer.test.ts && npm run check && npm run lint", "depends_on": [], "sections": {"Goal": "Add the shared wire types (`Pipe`, the stale frame, call records) to `shared/api.ts`, and the helpers that the index, the store and the server build on to `scripts/observer.ts`: the target path of a session, the `Targets` constructor input, the 150 ms shared sync budget. Also make the observer's first sync of a session read its existing target within the budget, and make `catOf` immune to prototype keys. Nothing calls the new helpers yet; current behaviour stays.", "Non-goals": "- No change to `scripts/wal-index.ts`, `scripts/sessions.ts`, `scripts/wal-server.ts` (sibling children).\n- No change to the read-only (`write: false`) path of the observer (Phase 5, T10). No background loop, no lock.\n- Do not edit `scripts/target.ts`, `scripts/session-view.ts` or any test file: they are outside this ticket.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md` Phase 4 §3 Contract. Carried items from T8's Comments: (a) T4 follow-up, first sync ignores budgetMs; (b) T3 follow-up, plain-object event lookup.\n\nContract 1, `shared/api.ts` (exact names, siblings import them):\n- `export type Pipe = { done: number; total: number; stale: string | null }`. `done` is WAL bytes the target covers, `total` the WAL size, `stale` the stale reason or null (the observer's `SyncResult`, `scripts/observer.ts:45`).\n- `FirstPage` (`shared/api.ts:78`) gains `pipe: Record\u003cstring, Pipe>`: one per picked session that discovery found.\n- `SessionView` (`shared/api.ts:219`) gains `pipe?: Pipe`, and `UsageTotals` (`shared/api.ts:236`) gains `pipe?: Record\u003cstring, Pipe>`. Optional only because `scripts/session-view.ts:89` and `:103` build these types without it and are outside T8's files; say so in a one-line comment. The store always sets them.\n- `export interface StaleFrame { sess: string; reason: string }`: the data of an `event: stale` frame on `/events-stream`.\n- `export interface CallRecord { k: 'call'; tuid: string; t: number; end: number; dur: number | null; tool: string | null; mcp: boolean; err: boolean; agent: string | null; agentType: string | null; input: unknown; response: unknown }`: a target call line as `/record` returns it (same fields as the `call` member of `TargetRecord`, `scripts/target.ts:48`).\n- `McpCallRecord` (`shared/api.ts:101`) gains `call: CallRecord`. Add `export interface CallOnlyRecord { call: CallRecord }` (a call row with no Pre or Post `ev`, as in a session without a WAL). `RecordResponse` (`shared/api.ts:107`) becomes `WalRecord | McpCallRecord | CallOnlyRecord`.\n- Update the comments that describe the old source: `Row` (`:29`, seq is the line number in the session's target), `Page` (`:44-49`, `gens` changes when a target is re-indexed), `SessionView` (`:216-218`, `version` is the target offset of the last stats record the store read and moves when the target turns stale; it is not unique across re-opens).\n- Carried (b): `catOf` (`shared/api.ts:27`) looks up `OF` with `Object.hasOwn`, so `catOf('constructor')` is `'session'`.\n\nContract 2, `scripts/observer.ts` (exported, exact names):\n- `export type SyncResult = Pipe` replaces the interface at `:45` (import `Pipe` from `shared/api.ts`).\n- `export type Observer = ReturnType\u003ctypeof createObserver>`.\n- `export const targetFile = (discovery: Pick\u003cDiscovery, 'locate'>, id: string): string | null`: null when `discovery.locate(id)` is null, else `targetPath({ label: '', projectsDir: dirname(dir) }, id)`, the formula at `:602`. Use it at `:602` too.\n- `export interface Targets { target: (id: string) => string | null; observer: Pick\u003cObserver, 'state'> }`: the first argument of `createIndexes` and `createStore` in the sibling children. The server passes `{ target: (id) => targetFile(discovery, id), observer }`.\n- `export const pipeOf = (observer: Pick\u003cObserver, 'state'>, id: string): Pipe`: `observer.state(id)` (`:676`), or `{ done: 0, total: 0, stale: null }` when null.\n- `export const syncBudget = (): number`: `Number(process.env.WAL_SYNC_BUDGET_MS)` when that env is set and is a finite number ≥ 0, else 150. Read on each call; comment that the env exists for tests only.\n- `export const syncAll = (observer: Pick\u003cObserver, 'sync' | 'state'>, ids: string[], budgetMs = syncBudget()): Record\u003cstring, Pipe>`: one deadline `Date.now() + budgetMs` shared by all ids, in order; each id gets `observer.sync(id, Math.max(0, deadline - Date.now()))`. A sync that throws is logged as `observer: sync \u003cid>: \u003cmessage>` with `console.error`, and that id gets `pipeOf(observer, id)`. Every id is a key of the result.\n\nContract 3, carried (a), the budgeted first sync (write mode only):\n- Today a new session in `sync` (`:604-609`) runs `absorb(s, s.reader.read().items)` on the whole target at once, whatever `budgetMs` is.\n- Change: in write mode, a new session absorbs its target in pieces. Add to `Session` the target byte offset absorbed so far and a flag that the absorb is not complete. Each sync, while not complete, reads the target from that offset with `lines()` (`:143`) under the same deadline the WAL pass uses (`now + budgetMs`, `:651`), and parses each line as `target.ts:137` does (skip a line that is not JSON or has no string `k`). It feeds the parsed records to `absorb` (`:224`), which takes `TargetItem[]`; build items with `off` and `len` as `createTargetReader` does (`scripts/target.ts:119`).\n- The absorb is complete when `lines()` returns the target size, or returns the offset it started from (the rest has no `\\n`: a torn tail). A missing target is complete at once.\n- While it is not complete, `sync` returns `result(s)` (`:261`) and runs no transcript or WAL pass. Once complete, it runs the version check of `:608` and goes on with the pass in the same call, with the time left.\n- A budget of 0 still reads one chunk per call (`lines()` checks the deadline after each chunk, `CHUNK` at `:23`), so repeated syncs always finish.\n- `fresh()` (`:201`) at `:629` and `:640` makes sessions with nothing absorbed to do: they stay complete as today. The read-only path (`:611-621`) still uses `s.reader` unchanged.\n\nThe test of (a) is in sibling T8.5 (`scripts/query.test.ts`, server restart with `WAL_SYNC_BUDGET_MS=0`), and the test of (b) also. Here, `node --test scripts/observer.test.ts` must stay green with no test edit.", "Comments": "- 2026-10-26 16:04 coordinator T8: status todo → in_progress\n- 2026-10-26 16:06 worker T8.1: status in_progress → done\n- 2026-10-26 16:06 coordinator T8: status done → in_progress\n- 2026-10-26 16:06 coordinator T8: Rework: npm run check must go green with no edit to web/. Add 'virtual?: undefined' to CallOnlyRecord in shared/api.ts so RecordViewer.tsx:55 type-checks. Run the full npm run check and npm run lint, then update Result.\n- 2026-10-26 16:06 worker T8.1: status in_progress → done", "Follow-ups": "- 2026-10-26 16:06 worker T8.1: web/src/components/RecordViewer.tsx:55 reads r.virtual on RecordResponse; the CallOnlyRecord member of the contract breaks it under web/tsconfig.json (npm run check). Owner T23 (its files): use 'virtual' in r.", "Result": "Landed:\n- shared/api.ts:27 catOf uses Object.hasOwn; :31 Pipe; :34 StaleFrame; :103 FirstPage.pipe; :114 CallRecord; :129 McpCallRecord.call; :137-141 CallOnlyRecord with `virtual?: undefined` (rework, so RecordViewer.tsx:55 type-checks without a web/ edit); :143 RecordResponse union; SessionView.pipe? and UsageTotals.pipe? (with the one-line comment); Row, Page and SessionView comments updated.\n- scripts/observer.ts:45 SyncResult = Pipe; :80-83 Session.absorbed/absorbing; :177 targetRecord; :272-285 absorbSome; :634 new write-mode session sets absorbing; :649-653 absorb gate then version check; :721 Observer; :724 targetFile (used in sync's file lookup); :730 Targets; :735 pipeOf; :738 syncBudget; :745 syncAll.\nCheck:\n- node --test scripts/observer.test.ts: 20 pass, 0 fail (no test edit).\n- npm run check: exit 0 (root and web tsc).\n- npm run lint: exit 0 (biome ci, 105 files).\nDecisions:\n- The absorb also completes in the same call when lines() stops short of the target size before the deadline: that can only be a torn tail. Without it the existing \"torn tail\" test failed (one sync, fresh observer).\n- syncBudget treats an empty or blank env as unset (Number('') would give 0).\n- sync calls targetFile for a new session, so discovery.locate runs twice there; a null target skips the session.\nOpen: none. The earlier follow-up about RecordViewer.tsx:55 is now moot; T23 needs no change for it."}}, "T8.2": {"verify": "! (npx tsc -p tsconfig.json --pretty false | grep -E '^scripts/wal-index\\.ts') && npx biome ci scripts/wal-index.ts && ! grep -nE '\\.wal\\.jsonl|subagents|createParser' scripts/wal-index.ts", "depends_on": ["T8.1"], "sections": {"Goal": "`scripts/wal-index.ts` builds each session's index from its target, read through `createTargetReader`, instead of from the WAL. Each `ev` and `call` record is one entry. `createIndexes` takes `Targets` and keys its indexes by target path. `query` puts the server's `pipe` on the first page.", "Non-goals": "- No edit to `scripts/wal-server.ts` (sibling T8.4 updates the call sites; until then `tsc` reports errors there, which is expected) or to any test file.\n- No `tok` records (Phase 6): skip them like every other non-row kind.\n- Keep `matcher`, `parentOf`, `lineageOf`, `ownerOf`, `agentTree`, `summary`, `cmp`, `vector`, `parseVector` and their semantics as they are.", "Context": "Build on T8.1: read `scripts/observer.ts` for `Targets` and `shared/api.ts` for `Pipe`. Plan Phase 4 §1 (copied): \"`tail()` reads the target through `createTargetReader` instead of the WAL. Each `ev` and `call` record becomes an entry. The virtual MCP pairing and the per-line derivation are removed, because the observer now does them. The read-time tree state (`agents`, `parents`, `about`, `links`) stays. `IndexEntry` keeps its fields, and `off` / `len` now point into the target. A call row has event `MCP call` for an MCP tool, else `Tool call`. Its cat follows the Post's cat. `day` / `minute` are derived from `t` at read time. `q` reads the source part of the target line, as in \"Search text\". `createIndexes` keys indexes by target path.\"\n\nDesign, settled:\n- `createWalIndex(id, path)` (`scripts/wal-index.ts:89`): `path` is the target. `tail()` (`:207`) calls `read()` of one `createTargetReader(path)` (`scripts/target.ts:147`) per index. When `read()` returns `reset: true`, clear the index exactly as `:213-225` does now (new gen from `genSeed`), then add the items. Remove `indexLine` (`:129`), `WalLine`, `MCP_ROLE`, `pending`, `CHUNK`, `pos` and the raw read loop. A missing target is an empty index (the reader handles it).\n- An `ev` item gives `{ off, len, t, day, minute, event: rec.event ?? undefined, cat: catOf(rec.event ?? undefined), tool, dur, tuid, agent, agentType, mcp, err, virtual: null }`. `cat` is recomputed with `catOf`, not read from the record, so targets written before the T8.1 `catOf` fix read right. `day` / `minute` as `:175-176`, from `new Date(t)`.\n- A `call` item gives `event: rec.mcp ? 'MCP call' : 'Tool call'`, `cat: rec.err ? 'fail' : rec.mcp ? 'mcp' : 'tool'` (decision: keeps the `mcp` facet that the old virtual rows filled; failed calls count as `fail` like their Post), `t: rec.t`, `dur: rec.dur`, `mcp: null`, `err: rec.err`, and `tool`, `tuid`, `agent`, `agentType` from the record.\n- `virtual` of a call entry: `{ pre, post }`, the seqs of the `ev` entries with the same `tuid` and event `PreToolUse` (pre) and `PostToolUse` / `PostToolUseFailure` (post), when both were indexed before it; else null. Keep a `tuid` map for this, cleared on reset, its entry deleted when the call is indexed, capped at `PENDING_MAX` (`:12`) by dropping the oldest key. The server's `/record` reads these seqs; `summary` (`:511`) already puts `virtual` on the row.\n- Every other kind (`head`, `use`, `turn`, `compact`, `agent`, `tools`, `cost`, `ck`, `stale`, `tok`) is no entry.\n- Tree state, for both `ev` and `call` entries: the `agents` rule of `:147-153` and `ix.tools.add(tool)`. For `ev` entries only, with `w = rec.rec` (the WAL line; absent on `raw` lines, and a transcript line on rows of a session without a WAL): the `parents` rule of `:155-161` (event `PostToolUse`, tool `Agent`, `w.payload.tool_response.agentId`) and the `about` rule of `:162-167` (event `SubagentStop`, `w.payload.background_tasks`). Read `w` defensively: it is untyped JSON.\n- `push` (`:111`) stays: it inserts a call entry, whose `t` is the earlier Pre time, at its place in `order`.\n- Search text (plan \"Search text\"): `reader(asc).text(r)` (`:265`) returns only the source part of the line: for a line that starts with `{\"k\":\"call\"`, from `\"input\":` to the end; else from `\"rec\":`, or `\"raw\":` when there is no `\"rec\":`, to the end. `serialize` (`scripts/target.ts:79`) puts `k` first and these keys last, and escaped quotes inside string values cannot match the unescaped key text. The window logic of `reader` stays.\n- `createIndexes` (`:303`) becomes `createIndexes(targets: Pick\u003cTargets, 'target'>, busy: (id: string) => boolean)`. `acquire(ids)` keeps its contract (null on an invalid id via `validId`; ids whose `targets.target(id)` is null go to `unknown`; tails every index it returns). The `open` map is keyed by target path; LRU eviction (`:325`) and `drop(id)` (`:330`) work by `ix.id`.\n- `query` (`:540`) becomes `query(ixs, p, unknown, pipe: Record\u003cstring, Pipe>)`; the first page carries `pipe` as given. Pages after the first do not.\n- Update the header comment (`:1-2`) and `IndexEntry` / `WalIndex` comments that name the WAL. The grep in `verify` must print nothing: no `.wal.jsonl`, `subagents` or `createParser` in this file, comments included.\n\nSelf-check before closing (scratch script outside the repo, not committed; report its output in the Result): copy `scripts/fixtures/projects` into a temp HOME's `.claude/projects`, add one WAL with a Pre / Post pair for `mcp__s__t` and one for `Bash` plus a line `{\"event\":\"constructor\"}`, run `createObserver({ discovery, write: true }).sync(id, 1000)` for each session, then `createIndexes({ target: (id) => targetFile(discovery, id) }, () => false).acquire(ids)`. Check: the WAL session has one `MCP call` (cat `mcp`) and one `Tool call` (cat `tool`), each with `virtual` pointing at its Pre and Post; the `constructor` row has cat `session`; a fixture session without a WAL has `Tool call` and `UserPromptSubmit` entries; `reader().text(e)` of an `ev` starts with `\"rec\":`.", "Comments": "- 2026-10-26 16:07 coordinator T8: status todo → in_progress\n- 2026-10-26 16:08 worker T8.2: status in_progress → done", "Follow-ups": "", "Result": "Landed:\n- scripts/wal-index.ts:1-2,4-12 header, imports (createTargetReader, Targets, Pipe) and PENDING_MAX; CHUNK, MCP_ROLE, WalLine and the `pos` raw read loop removed; :14-18 Payload type; :32-39 sourceOf (search text); :42-70 IndexEntry/WalIndex comments.\n- scripts/wal-index.ts:95-244 createWalIndex: tail() reads one createTargetReader, resets as before, one entry per `ev` and `call` record; helpers noteAgent, notePending (:144, tuid map capped at PENDING_MAX), noteTree (:159, parents/about from `rec.rec`), stamp. `push` unchanged.\n- scripts/wal-index.ts:270 reader.text returns sourceOf(line); window logic unchanged.\n- scripts/wal-index.ts:286-318 createIndexes(targets, busy) keyed by target path; `unknown` from a null target; LRU and drop(id) go by ix.id.\n- scripts/wal-index.ts:522, :610 query(ixs, p, unknown, pipe) puts `pipe` on the first page only.\nCheck:\n- `! (npx tsc -p tsconfig.json --pretty false | grep -E '^scripts/wal-index\\.ts') && npx biome ci scripts/wal-index.ts && ! grep -nE '\\.wal\\.jsonl|subagents|createParser' scripts/wal-index.ts`: exit 0 (biome: 1 file, no fixes; tsc errors remain only in wal-server.ts, session-view.test.ts, bench-sessions.ts, as expected until T8.4).\n- Scratch self-check (/tmp, not committed): `node /tmp/t82chk/check.ts`, \"ALL OK\". WAL session: 7 entries; one `MCP call` (cat mcp, virtual {pre:0,post:1}), one `Tool call` (cat tool, virtual {pre:3,post:4}); both virtuals point at PreToolUse / PostToolUse entries with the same tuid; `constructor` row cat `session`; fixture session d01c2dfc has `Tool call` and `UserPromptSubmit`; `reader().text` of an ev starts with `\"rec\":`, of a call with `\"input\":`; an unknown id lands in `unknown`.\nDecisions:\n- sourceOf falls back to `\"response\":` when a call line has no `\"input\":` (an undefined input is not serialized), and to the empty string when no source key is found.\n- Tree state, `tools` and the pending map are updated before/after push in the same loop; a call entry's `virtual` is null when the Pre or Post was not indexed first.\n- `drop(id)` scans the map for ix.id, since the map is keyed by path.\nOpen: none. T8.4 must pass `targets` (with `target`) to createIndexes and `pipe` to query at wal-server.ts:66-67 and :307."}}, "T8.3": {"verify": "! (npx tsc -p tsconfig.json --pretty false | grep -E '^scripts/sessions\\.ts') && npx biome ci scripts/sessions.ts && ! grep -nE '\\.wal\\.jsonl|subagents|createParser' scripts/sessions.ts", "depends_on": ["T8.1"], "sections": {"Goal": "`scripts/sessions.ts` keeps its API (`acquire`, `get`, `view`, `usage`, `drop`, plus `validId`, `parseScope` and the `Session` type), but builds each session from its target's records through `scripts/session-view.ts`. Its transcript parsers go. Every view and usage carries `pipe`.", "Non-goals": "- No edit to `scripts/wal-server.ts` or `scripts/bench-sessions.ts` (siblings T8.4 and T8.8 update the call sites; until then `tsc` reports errors there and in `scripts/session-view.test.ts`, which is expected) or to `scripts/session-view.ts`.\n- No sync inside the store: the server syncs before it reads.", "Context": "Build on T8.1: read `scripts/observer.ts` for `Targets` and `pipeOf`, and `shared/api.ts` for `Pipe`. Build on T6: `scripts/session-view.ts` (`createSessionData` `:25`, `absorb` `:28`, `view` `:89`, `usage` `:103`). Reader: `createTargetReader` (`scripts/target.ts:147`), items `{ rec, off, len }` (`:119`).\n\nPlan Phase 4 §2 (copied): \"The store keeps its API (`get`, `view`, `usage`, `drop`), but it reads target records through `session-view.ts`. Its parsers move into the observer. `version` is the target offset of the last transcript record read, so WAL rows do not resend views. It also changes when `pipe.stale` is set. `gen` changes when the store re-opens the target.\"\n\nDesign, settled:\n- `createStore(targets: Targets, busy: (id: string) => boolean)` replaces `createStore(discovery, busy)` (`scripts/sessions.ts:43`).\n- `export interface Session { id: string; gen: number; version: number; file: string; reader: TargetReader; data: SessionData }`.\n- `load(id)` (`:107`): a cached session reads `s.reader.read()`; an uncached one gets `file = targets.target(id)` (null: drop it from `open`, return null, so `acquire` lists it in `unknown`), a new reader, `createSessionData()`, `gen = ++gen` (seed `Date.now()` as `:46`), `version = 0`, then reads. When `read()` returns `reset: true`, the session is re-opened: new `SessionData`, new gen, version 0, then the items. A missing target is a session with no data.\n- Feed `absorb(s.data, items.map((i) => i.rec))`. `version` becomes the `off` of the last item read whose `k` is `use`, `turn`, `compact`, `agent`, `tools`, `cost` or `stale`. So `ev`, `call` and `ck` lines do not move it, and the `stale` record the observer appends moves it once.\n- `acquire` (`:133`), `get` (`:146`) and the LRU (`:142`) keep their rules; `drop` (`:218`) stays.\n- `view(s, scope)`: `view(s.data, { id: s.id, gen: s.gen, version: s.version }, scope)` from `session-view.ts`, null passed through, plus `pipe: pipeOf(targets.observer, s.id)`.\n- `usage(ss, unknown)`: `usage(ss.map((s) => s.data), unknown)` from `session-view.ts`, plus `pipe` keyed by `s.id` with `pipeOf`.\n- Remove `grow`, `discover`, `advance`, `records`, `recorded`, `agentStat`, `has`, `Tracked`, `Agent`, `CHUNK`, `pricing` and the imports they used. Keep `AGENT_RE` (used by `parseScope`, `:20`) and `validId` (`:18`, imported by `scripts/wal-index.ts` and `scripts/wal-server.ts`).\n- Decision in force (T8 Comments): nested agents list spawner first, the order of the `agent` records (`scripts/session-view.ts:53`), not readdir order. That is intended.\n- Update the header comment (`:1-3`). The grep in `verify` must print nothing, comments included.\n\nSelf-check before closing (scratch script outside the repo, not committed; report its output in the Result): copy `scripts/fixtures/projects` into a temp HOME's `.claude/projects`, sync each fixture session with `createObserver({ discovery, write: true }).sync(id, 1000)`, then `createStore({ target: (id) => targetFile(discovery, id), observer }, () => false)`. Check: for each session and scope, `store.view` deep-equals the `git show HEAD:scripts/sessions.ts` store's view (run the old file from a `git archive HEAD` copy in the temp dir) except `version`, `gen`, `pipe` and the agent order above; a second `get` with no target change keeps `version`; appending a `{\"k\":\"stale\",\"reason\":\"x\"}` line to one target moves its `version` and `pipe` comes from the observer.", "Comments": "- 2026-10-26 16:07 coordinator T8: status todo → in_progress\n- 2026-10-26 16:07 worker T8.3: status in_progress → done\n- 2026-10-26 16:08 worker T8.3: status done → in_progress\n- 2026-10-26 16:08 worker T8.3: status in_progress → done", "Follow-ups": "", "Result": "Landed:\n- scripts/sessions.ts:1-3 header; :5-9 imports; :12-15 constants incl. STAT_KINDS; :17-20 validId and parseScope kept; :22-30 Session (id, gen, version, file, reader, data); :32 createStore(targets, busy); :37-62 load (new session via targets.target, reset re-opens with new data, gen, version 0; version = off of last stats record); :64 acquire, :77 get; :79 view (session-view view plus pipe); :84 usage (session-view usage plus pipe per id); :93 drop. LRU rule unchanged.\n- Removed grow, discover, advance, records, recorded, agentStat, has, Tracked, Agent, CHUNK, pricing and their imports. AGENT_RE and validId kept.\nCheck:\n- npx tsc -p tsconfig.json --pretty false | grep -E '^scripts/sessions\\.ts': no output (grep rc 1). Other tsc errors are in sibling files only (wal-server.ts, bench-sessions.ts, session-view.test.ts, wal-index.ts), none in sessions.ts.\n- npx biome ci scripts/sessions.ts: exit 0.\n- grep -nE '\\.wal\\.jsonl|subagents|createParser' scripts/sessions.ts: no output (rc 1).\n- Self-check, scratch script in a temp dir outside the repo (HOME=temp, 4 fixture sessions, old store from git archive HEAD): 9 views (all, main, agent scope per session) deep-equal the old store's, except version, gen, pipe and agents sorted by id; each view.pipe equals observer.state(id) or the zero Pipe; usage equals the old usage plus pipe keyed by all 4 ids; an unknown agent scope gives null; an unknown id lands in unknown; a second get keeps version (75, 16020, 1133, 872); appending {\"k\":\"stale\",\"reason\":\"x\"} moved version 75 -> 172, gen unchanged. Output ended with OK, rc 0.\nDecisions:\n- A reset re-opens the session in place (same Session object, new data, gen and version) so a holder of the object sees the new state.\n- The self-check sorted agents by id because the fixtures hold one agent per session, so the spawner-first order was not exercised.\nOpen: none."}}, "T8.4": {"verify": "! (npx tsc -p tsconfig.json --pretty false | grep -E '^scripts/wal-server\\.ts') && npx biome ci scripts/wal-server.ts && ! grep -nE '\\.wal\\.jsonl|subagents|createParser' scripts/wal-server.ts", "depends_on": ["T8.2", "T8.3"], "sections": {"Goal": "`scripts/wal-server.ts` runs one observer with `write: true`, syncs each request's sessions within the shared budget before it reads, syncs the streamed sessions on each tick, sends `event: stale` instead of `reset` for a stale target, answers `/record` fr
