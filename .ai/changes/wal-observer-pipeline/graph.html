nd `/events-stream` (`:289`): sync the picked ids (or the empty-pick list), acquire, and `query(ixs, p, unknown, pipe)` where `pipe` holds the entries of `syncAll`'s result for the acquired `ixs` only. `/record` (`:329`): sync `[id]` first. `/session` (`:364`): sync `[id]`. `/usage`, `/usage-stream`, `/session-stream` (`:379`): sync `ids`.\n- Tick (`:190`): before `walTick()` and `sessionTick()`, one `syncAll` over the union of the ids of `clients` (their `ixs`) and of `sessionClients`, so a session in both is synced once per tick.\n- Stale on `/events-stream`: `Client` (`:47`) gains `stale: Set\u003cstring>`, filled at stream open with the picked ids whose `pipe.stale` is already set (the page has them from `FirstPage.pipe`). In `walTick` (`:137`), for each `ix` of a client whose `pipeOf(observer, ix.id).stale` is set and not in `client.stale`, write `event: stale\\ndata: ${JSON.stringify({ sess, reason } satisfies StaleFrame)}\\n\\n` and add the id. No `reset` for this. The gen-mismatch `reset` (`:156-162`) stays for a target that is re-indexed.\n- `/session-stream` and `/usage-stream` need no new code: the store moves `version` when the stale record lands, so `sessionTick` (`:101`) sends the next frame, and its view or usage carries `pipe`.\n- `/record`: read the entry's bytes from `ix.path` (the target) and `JSON.parse` the target line. An `ev` line returns its `rec`, or for a `raw` line `parse(raw)` (`:38`), so `ev` rows keep today's shape. A `call` line returns `{ virtual: true, pre, post, call }` when the entry has `virtual` (`pre` / `post` = the `rec` of the target lines at `entries[virtual.pre]` / `entries[virtual.post]`), else `{ call }`. `call` is the parsed call line.\n- `forget` (`:116`): also `observer.drop(id)`, so trash and restore drop the reader state and the next sync re-opens the target. The reset and unknown frames it sends stay.\n- Purge (`writeOf`, `:239`): for `/trash/purge`, take `trash.list()` (`scripts/trash.ts:119`) before `trash.purge(...)` (`:200`). For each result with status `ok`, for each listed entry with that id, for each source in `discovery.sources()` (`scripts/discovery.ts:409`) whose `label` is the entry's `source`, `rmSync(targetPath(source, id), { force: true })` (`scripts/target.ts:18`); then `observer.drop(id)`, `indexes.drop(id)`, `store.drop(id)`. Purge is detected here only, not in `trash.ts`.\n- Remove imports this makes unused. The grep in `verify` must print nothing, comments included.\n\nBefore closing, run `npx vite build --logLevel warn && node --test scripts/query.test.ts scripts/live-tail.test.ts scripts/sessions.test.ts scripts/usage.test.ts scripts/trash.test.ts scripts/discovery.test.ts` once. Do not fix the tests. In the Result, list each failing check by file and name, tagged with the planned change it comes from (call rows replace virtual rows; no-WAL sessions get rows; stale instead of reset; `pipe.stale` instead of a higher gen) or `unplanned`. An `unplanned` failure from this file is yours to fix.", "Comments": "- 2026-10-26 16:08 coordinator T8: status todo → in_progress\n- 2026-10-26 16:23 worker T8.4: status in_progress → done", "Follow-ups": "- 2026-10-26 16:23 worker T8.4: query.test.ts 'lineage: 3000 rows of a 3000-deep chain match in under 1.5s' failed at 2312ms under load average 24; matcher/lineageOf are unchanged from HEAD, so the 1.5s bound is load-sensitive.\n- 2026-10-26 16:23 worker T8.4: Purge deleting the target (wal-server.ts:262-276) has no test yet; trash.test.ts purge checks pass but do not look at the wal-viewer dir.\n- 2026-10-26 16:23 worker T8.4: A failing live-tail.test.ts run leaves its spawned wal-server (--port=0) orphaned and node --test never exits; I killed the orphan (pid 381704, HOME=/tmp/waltail.*) by hand.", "Result": "Landed:\n- scripts/wal-server.ts:8,13-17 imports (rmSync, CallRecord, StaleFrame, observer.ts, target.ts); :48-51 `Ev` type and `walOf` (ev line to WalRecord, `raw` through `parse`).\n- scripts/wal-server.ts:60-61 ` al-observer-pipeline/plan.md`, Phase 5 and \"Single writer\".\n\nBuild on T8 (server reads targets via `observer.sync`) and T1 (`acquireLock(dir)` / `releaseLock` in `scripts/target.ts`).\n\nContract (copied from plan.md Phase 5):\n- At start, the server takes the lock of each source's target dir. With the lock, it runs a 1 s loop over all `discovery.list()` sessions (`scripts/discovery.ts:373`). Each tick works in slices of at most 50 ms, so requests stay fast.\n- `sync` reports `done` / `total` as WAL plus transcript bytes.\n- New sessions and grown sources are synced. Sessions never built are built in the background.\n- Without the lock, the observer is not started (read-only mode), and the server logs that once. Read-only still serves the targets.\n- `GET /observer` reports the progress. `POST /rebuild {ids}` deletes those targets and the in-memory state; the loop then builds them again. It uses the existing `crossSite` (`scripts/wal-server.ts:220`) and `writeOf` (`:239`) POST pattern.\n- `shared/api.ts`: `ObserverStatus = {owner: boolean; total: number; built: number; building: string[]; stale: {id, reason}[]}`. `/rebuild` returns `{results: {id, ok, error?}[]}`. It is refused with 409 in read-only mode.\n\nSecurity: `ids` come from the page. Validate every id with `validId` (`scripts/sessions.ts:18`) and build target paths only through `targetPath`, as `/trash` does (`scripts/wal-server.ts:243`). A cross-site POST is refused like the trash routes.\n\nTests (server cases of plan.md Phase 5 §4), through `startServer` (`scripts/test-server.ts:13`) with a temp `HOME`: the backlog builds with no request and `/observer` reaches `built === total`; a WAL appended with no client open is synced by the loop; a shrunk WAL appears in `stale` and its rows stop updating; `/rebuild` clears the stale state and rebuilds; a second server is read-only and refuses `/rebuild` with 409.\n\nDo not commit; the orchestrator commits each phase after its review.", "Comments": "- 2026-10-26 15:37 orchestrator: Carried in from T5 follow-ups: (a) read-only observer (write:false) skips a no-WAL session, so it reports no stale for a no-WAL target (observer.ts:~600); cover it with the read-only server. (b) transcript reads are not budgeted; first sync of a long session parses all transcripts at once; count transcript bytes in /observer progress.", "Follow-ups": "", "Result": ""}}, "T11": {"verify": "npx vite build --logLevel warn && node --test scripts/observer-server.test.ts && npm run check && npm run lint", "depends_on": ["T10"], "sections": {"Goal": "Add `wal rebuild [ids…] [--source=\u003cconfig-dir>]…`, which rebuilds the given sessions, or all, and prints the progress per session (plan.md Phase 5 §3). Add the CLI cases to `scripts/observer-server.test.ts` and update the README usage block.", "Non-goals": "- No new README \"Pipeline\" section: T26 writes it in Phase 8.\n- No change to the server loop or routes (T10).", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, Phase 5 §3 and §4.\n\nBuild on T10: the rebuild function it exports from `scripts/observer.ts`, and `acquireLock` / `releaseLock` from `scripts/target.ts`.\n\nContract (copied from plan.md Phase 5 §3): if a live pid holds the lock, it exits 1 with `server running — use Rebuild in the page`. Otherwise, it takes the lock for the run.\n\nPattern: `wal legacy` in `scripts/cli.ts` spawns `script('legacy')` with the remaining args; add `rebuild` the same way, and add the line to `usage` (`scripts/cli.ts:10`). Where the entry point lives (a `main` guard in `scripts/observer.ts`) is your choice inside the listed files.\n\nREADME: add `wal rebuild [ids…] [--source=\u003cconfig-dir>]...` to the usage block in \"Running\", and add `/rebuild` to the list of write endpoints in the same section.\n\nTests (CLI cases of plan.md Phase 5 §4): the CLI refuses while a server holds the lock (exit 1, the message above on stderr), and it rebuilds when none holds it.\n\nDo not commit; the orches scripts/transcripts.test.ts`.", "Non-goals": "- No join, no `tok` records (T15). No change to `UsageRecord` values, `aggregate` or any existing output.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, Phase 6 §1 and \"Token rules\".\n\nExisting code: `createParser` (`scripts/transcripts.ts:115`) already merges streamed lines per `message.id` and collects tool ids (`:173-194`). `UsageRecord` (`:39`) has no tool_use ids, and items keep no result size.\n\nContract (copied from plan.md Phase 6 §1):\n- Per reply: its tool_use / server_tool_use ids in block order, the input size of each, and the prefix of its last text block (2000 chars).\n- Per tool id: its reply id and its result size, set when the tool_result arrives.\n- Per reply: a flag for \"a user prompt came after this reply\". It is set when a non-tool_result user line follows the reply.\n\nDefinitions from \"Token rules\": input size is `JSON.stringify(input).length`. The result size is the length of the tool_result content: the string itself, or `JSON.stringify` of the blocks. A reply's lines can be split by other lines, so group them by `message.id`.\n\nTests: one assertion per clause above, plus one that existing outputs are unchanged (the current cases stay green unchanged). Copy the pattern of the existing cases in `scripts/transcripts.test.ts`.\n\nDo not commit; the orchestrator commits each phase after its review.", "Comments": "", "Follow-ups": "", "Result": ""}}, "T15": {"verify": "node --test scripts/tokens.test.ts scripts/observer.test.ts && npm run check && npm run lint", "depends_on": ["T14", "T10", "T11"], "sections": {"Goal": "The observer applies \"Token rules\" after each pass and appends `tok` records for call rows and Stop / SubagentStop rows; it keeps open calls and open Stops per session and retries them on every pass (plan.md Phase 6 §2). Add `scripts/tokens.test.ts` with the observer-level cases of Phase 6 §4. Then run manual check 6.4 on a copy of real data.", "Non-goals": "- No index or `Row` change (T16). No filter, order or stream (Phase 7).\n- No use of the hook's `context` field.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, read \"Token rules\", \"Replay must not write\", \"Sessions without a WAL\" and Phase 6 §2, §4.\n\nBuild on T14 (the parser data in `scripts/transcripts.ts`), T5/T10/T11 (`scripts/observer.ts`), T1 (`tok` in `TargetRecord`).\n\nContract (copied from plan.md):\n- `tok {tuid, out, res?}` targets a call row; `tok {woff, out}` targets the Stop / SubagentStop `ev` at that WAL offset. The last `tok` per target wins.\n- For a call whose `tool_use_id` is in reply R of agent A's transcript: N is the next distinct reply after R in A's file order. `prompt(x)` = input + cacheRead + cacheWrite5m + cacheWrite1h. Output: R.output, split over R's `tool_use` and `server_tool_use` blocks by `JSON.stringify(input).length`. Result: growth = prompt(N) − prompt(R) − R.output, split by the result size of each block. Splits round so that the parts add up to the whole.\n- Result is omitted (Output only) when growth \u003c 0 (compaction), when a user prompt (a non-tool_result user line) lies between R and N (an interrupted turn), or when N does not exist and the WAL has a `SessionEnd` after the call.\n- N does not exist and the session has not ended: the call stays open, and no `tok` is written yet. A session without a WAL never ends, so its last open calls stay open. A `tool_use_id` in no transcript: no `tok` is ever written.\n- Stop / SubagentStop: `out` is the output of the agent's last reply with `t` ≤ the Stop `ts`. That reply's last text block must start with `last_assistant_message` (with its `…[+N chars]` suffix cut). Until such a reply exists, the Stop stays open.\n- A WAL row with `agent_id` joins against `subagents/agent-\u003cagent_id>.jsonl`; with no such file, there is no `tok`. A `tool_use_id` found in more than one file uses the first file read.\n- After a restart, the open-call set is rebuilt from the target (calls with no `tok` yet); replay writes nothing.\n\nTests (observer-level cases of plan.md Phase 6 §4), from the fixture transcripts (`scripts/fixtures/projects/`) plus hand-made WALs that copy their `tool_use_id`s: a single call; parallel calls split by input size and result size with parts adding up; streamed subagent replies use the final count; compaction gives no `res`; an interrupted turn gives no `res`; no next request: open while live, Output only after `SessionEnd`; a Stop matched by prefix, including a clamped `last_assistant_message`; a SubagentStop with no transcript file gives no `tok`; a `tok` across a restart without duplicates; an MCP call row gets a `tok`; a session without a WAL gets `tok` for its call rows and its Stop rows carry `out`.\n\nManual check 6.4, on a copy of real data, never in the real `~/.claude`: copy a real session with large calls (a WAL plus its transcripts) into a temp `HOME`, build its target with the observer, and check the Output / Result of at least three large calls by hand against the transcript's usage lines. Write the calls, the expected and the actual numbers in the Result. Put anything you could not check under `Open:` as an item for the user.\n\nDo not commit; the orchestrator commits each phase after its review.", "Comments": "", "Follow-ups": "", "Result": ""}}, "T16": {"verify": "npx vite build --logLevel warn && node --test scripts/query.test.ts scripts/live-tail.test.ts && npm run check && npm run lint", "depends_on": ["T15"], "sections": {"Goal": "A `tok` record becomes a hidden index entry that sets `out` / `res` on its target row, and `Row` carries the numbers (plan.md Phase 6 §3). Add a server-level case to `scripts/query.test.ts` that a call row and a Stop row return `out` / `res` in `/events`.", "Non-goals": "- No token filter, `sort=tokens` or `tokens` stream frames (Phase 7).\n- No change to the observer.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, Phase 6 §3 and \"One seq `, `max_tok`, `notok=include`) and, with `sort=tokens`, returns rows in Tokens order, paged (plan.md Phase 7 §1, §2). Add the query cases of Phase 7 §4 to `scripts/query.test.ts`.", "Non-goals": "- No stream change (T19). No sort key other than Total. Without `sort`, nothing changes.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, read \"Sorted pages with `q`\", \"Sort cursor\" and Phase 7 §1, §2, §4.\n\nBuild on T16 (`IndexEntry.out` / `res` / `hidden`).\n\nContract (copied from plan.md):\n- Filter (`matcher`, `scripts/wal-index.ts:471`): params `min_tok`, `max_tok` and `notok=include`, parsed with `num()` (`:353`). The filter applies only when a bound is set. Total = `out + (res ?? 0)` when `out` is set. A row with no `out` passes only with `notok=include`. The check goes before `q`. Same rules as the duration filter next to it.\n- Order (`query`, `:540`): with `sort=tokens`, rows order by `(total, t, sess, seq)` descending, with `total = -1` for no data. `before` is `\u003ctotal>.\u003ct>.\u003csess>.\u003cseq>` and matches `^(-?\\d+)\\.(-?\\d+)\\.([0-9a-f-]{36})\\.(\\d+)$`; `next` is built in the same form. Each page is one scan of the pick that keeps the top `limit` rows below the cursor. The first page still returns `total`, `counts`, `spans`, the facets and `pipe`. A `before` in the wrong form for the mode reads as no cursor.\n- Sorted pages with `q`: on a page after the first, the scan applies the filter without `q`, sorts the rows below the cursor, and then tests `q` in that order until `limit + 1` hits. Only the first page runs `q` on every row.\n\nTests (through the server; fixtures are WALs plus transcripts with matching `tool_use_id`s): `min_tok` / `max_tok`, with and without `notok`; `sort=tokens` paged with `pageAll` (`scripts/query.test.ts:172`) against one full sorted list, with ties and no-data rows last; `sort=tokens` combined with `tool` and `q`; time order unchanged without `sort`.\n\nDo not commit; the orchestrator commits each nscripts, a wait for the build, and new time limits.", "Non-goals": "- No change to the server, index or observer: a limit that fails is reported as `blocked` with the numbers, not fixed here.", "Context": "Plan: `.ai/changes/wal-observer-pipeline/plan.md`, Phase 7 §5 and \"Performance Considerations\".\n\nBuild on T10 (`GET /observer` returns `ObserverStatus` with `built` / `total`, `shared/api.ts`) and T18 (`min_tok`, `sort=tokens`).\n\nContract (copied from plan.md Phase 7 §5):\n- The fixtures add transcripts with usage and matching `tool_use_id`s. Today `scripts/bench.ts` writes 5 × 20 MB WALs (`SESSIONS`, `SESSION_BYTES`, `:17-18`) and an empty transcript per session (`:45`).\n- The bench waits for `/observer` to report `built === total` before it times queries, and it reports the build time.\n- Existing limits stay: first / next page ≤ 300 ms, `q` ≤ 3 s, RSS ≤ 300 MB.\n- New checks: build of the 5 × 20 MB fixture ≤ 30 s; `min_tok` first page ≤ 300 ms; `sort=tokens` first and next page ≤ 300 ms; `sort=tokens` with `q`: first page ≤ 3 s, next page ≤ 300 ms.\n- `total` counts rows only (the `ev` and `call` records), and `seq` checks use the row seqs.\n\nDo not commit; the orchestrator commits each phase after its review.", "Comments": "", "Follow-ups": "", "Result": ""}}, "T21": {"verify": "npm run check && npm run lint && npm test && npm run bench", "depends_on": ["T18", "T19", "T20"], "sections": {"Goal": "Check that T18, T19 and T20 meet their Goals and plan.md Phase 7 (Server — token filter, Tokens order, live frames, bench), progress items 7.1-7.4.", "Non-goals": "- Web UI: Phase 8.", "Context": "Decisions to hold the work to: scope is plan.md phases 1-8; no Tokens order while Live is on and no live insertion into a sorted list; the sort key is always Total. Bench limits are the ones in plan.md Phase 7 §5, unchanged. \"One seq space for patches\": no second position vector.", "Comments": "", "Follow-ups": "", "Result": ""}}, "T22": {"verify": "node --test we     <script>
      "use strict";

const data = JSON.parse(document.getElementById("data").textContent);
const SVG_NS = "http://www.w3.org/2000/svg";
// Must match the key the head script of graph.html reads before first paint.
const THEME_KEY = "agent-board.graph.theme";
const THEMES = ["system", "light", "dark"];

const rootStyle = getComputedStyle(document.documentElement);
const SANS = rootStyle.getPropertyValue("--sans").trim() || "sans-serif";
const MONO = rootStyle.getPropertyValue("--mono").trim() || "monospace";
const TITLE_FONT = `600 13px ${SANS}`;
const ID_FONT = `500 12px ${MONO}`;
const TAG_FONT = `11px ${SANS}`;
const MAX_LABEL = 220;
const PAD_X = 12;
const PAD_Y = 10;
const LINE = 17;
const ID_GAP = 7;
const TAG_H = 17;
const TAG_GAP = 7;
const DOT = 6;
const HEX = 12;
const HEADER = 24;
const GUTTER = 88;
const STUB = 12;
const PORT_GAP = 12;
const GRAY = {
  color: "#d1d5db",
  stroke: "#6b7280",
  text: "#0f172a",
  meaning: "unknown status",
};

const tickets = new Map(data.graph.nodes.map((n) => [n.id, n]));
const childrenOf = new Map();
for (const n of data.graph.nodes) {
  if (tickets.has(n.parent)) {
    if (!childrenOf.has(n.parent)) childrenOf.set(n.parent, []);
    childrenOf.get(n.parent).push(n.id);
  }
}
const deps = data.graph.edges.filter((e) => e.type === "depends_on");
const tagHue = new Map(Object.keys(data.tags).map((tag, i, all) => [tag, Math.round((i * 360) / all.length)]));
let folded = new Set();
const nodeEls = new Map();
const foldEls = new Map();
let phaseLabels = null;
let selected = null;
let hovered = null;

const statusOf = (name) => data.statuses[name] || GRAY;

// Theme rules live in viewer.css; a status element only carries the vocabulary colours.
function paintStatus(el, name) {
  const st = statusOf(name);
  el.classList.add("st");
  el.style.setProperty("--fill", st.color);
  el.style.setProperty("--stroke", st.stroke);
  el.style.setProperty("--text", st.text);
}

// --- markdown ----------------------------------------------------------------

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// Browsers drop control characters and spaces inside a scheme ("java\tscript:"), so strip them
// before the test. A colon before the first "/", "?" or "#" is a scheme; anything else is relative,
// except a leading "//" or "\\" (any mix), which browsers read as a link to another host.
function safeHref(href) {
  const url = href.replace(/[\u0000- \u007f]/g, "");
  if (/^[/\\]{2}/.test(url)) return false;
  const scheme = /^([^/?#]*?):/.exec(url);
  return !scheme || /^(https?|mailto)$/i.test(scheme[1]);
}

const md = new marked.Marked({
  renderer: {
    html(token) {
      return escapeHtml(token.text);
    },
    // An <img> would fetch its src as soon as the drawer opens: show the alt text only.
    image(token) {
      return escapeHtml(token.text);
    },
    link(token) {
      const inner = this.parser.parseInline(token.tokens);
      if (!safeHref(token.href)) return inner;
      const title = token.title ? ` title="${escapeHtml(token.title)}"` : "";
      return `<a href="${escapeHtml(token.href)}"${title} target="_blank" rel="noopener">${inner}</a>`;
    },
  },
});

const goalCache = new Map();
function goalExcerpt(id) {
  if (!goalCache.has(id)) {
    const html = md.parse(data.tickets[id].sections.Goal || "");
    const parsed = new DOMParser().parseFromString(html, "text/html");
    const plain = parsed.body.textContent.replace(/\s+/g, " ").trim();
    goalCache.set(id, plain.length > 200 ? `${plain.slice(0, 200)}…` : plain);
  }
  return goalCache.get(id);
}

// --- DOM helpers -------------------------------------------------------------

function svgEl(tag, attrs, parentEl) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parentEl) parentEl.append(e);
  return e;
}

function htmlEl(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function statusChip(name) {
  const chip = htmlEl("span", "chip", name);
  paintStatus(chip, name);
  chip.title = statusOf(name).meaning;
  return chip;
}

function tagChip(tag) {
  const chip = htmlEl("span", "chip tag", tag);
  chip.style.setProperty("--hue", tagHue.get(tag) ?? 0);
  chip.title = data.tags[tag] || "";
  return chip;
}

function shapeIcon(review) {
  const icon = svgEl("svg", { width: 22, height: 14, class: "shape-icon", "aria-hidden": "true" });
  if (review) {
    svgEl("polygon", { points: "5,1 17,1 21,7 17,13 5,13 1,7" }, icon);
  } else {
    svgEl("rect", { x: 1, y: 1, width: 20, height: 12, rx: 3 }, icon);
  }
  return icon;
}

// --- header ------------------------------------------------------------------

function readTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    return THEMES.includes(saved) ? saved : "system";
  } catch {
    return "system";
  }
}

const systemDark = matchMedia("(prefers-color-scheme: dark)");

// From "system" the first click goes to the opposite of what the system shows, so it always
// changes the look.
function nextTheme(theme) {
  const system = systemDark.matches ? "dark" : "light";
  const order = ["system", system === "dark" ? "light" : "dark", system];
  return order[(order.indexOf(theme) + 1) % order.length];
}

function applyTheme(theme, button) {
  if (theme === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  button.textContent =
    theme === "system" ? `Theme: system (${systemDark.matches ? "dark" : "light"})` : `Theme: ${theme}`;
  button.title = `Switch to ${nextTheme(theme)}`;
}

function themeButton() {
  const button = htmlEl("button", "theme");
  button.type = "button";
  let theme = readTheme();
  applyTheme(theme, button);
  systemDark.addEventListener("change", () => applyTheme(theme, button));
  button.addEventListener("click", () => {
    theme = nextTheme(theme);
    try {
      if (theme === "system") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, theme);
    } catch {
      // file:// pages may refuse storage: the choice then lasts until the next reload.
    }
    applyTheme(theme, button);
  });
  return button;
}

function renderHeader() {
  const header = htmlEl("header");
  const title = htmlEl("div", "title");
  title.append(htmlEl("h1", "", data.graph.change), htmlEl("span", "total", `${data.graph.nodes.length} tickets`));
  const legend = htmlEl("div", "legend");
  for (const name of Object.keys(data.statuses)) {
    const count = data.graph.nodes.filter((n) => n.status === name).length;
    const item = htmlEl("span", count ? "status" : "status none");
    const swatch = htmlEl("span", "swatch");
    paintStatus(swatch, name);
    item.append(swatch, htmlEl("span", "", name), htmlEl("span", "count", String(count)));
    item.title = data.statuses[name].meaning;
    legend.append(item);
  }
  legend.append(htmlEl("span", "sep"));
  for (const [review, label, meaning] of [
    [false, "work", "Work ticket"],
    [true, "review", "Review ticket"],
  ]) {
    const item = htmlEl("span", "shape");
    item.append(shapeIcon(review), htmlEl("span", "", label));
    item.title = meaning;
    legend.append(item);
  }
  header.append(title, legend, themeButton());
  return header;
}

// --- measure -----------------------------------------------------------------

const measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(text, font) {
  measureCtx.font = font;
  return measureCtx.measureText(text).width;
}

function wrap(text, max) {
  const lines = [];
  let line = "";
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const next = line ? `${line} ${word}` : word;
    if (line && textWidth(next, TITLE_FONT) > max) {
      lines.push(line);
      line = word;
    } else {
      line = next;
    }
  }
  lines.push(line);
  return lines;
}

const sizes = new Map();
for (const n of data.graph.nodes) {
  const idWidth = Math.ceil(textWidth(n.id, ID_FONT));
  const lines = wrap(n.title, MAX_LABEL - idWidth - ID_GAP);
  const tags = n.tags.map((tag) => ({
    tag,
    width: Math.ceil(textWidth(tag, TAG_FONT)) + DOT + 14,
  }));
  const tagsWidth = tags.reduce((sum, c) => sum + c.width, 0) + 4 * Math.max(tags.length - 1, 0);
  const inner = idWidth + ID_GAP + Math.max(tagsWidth, ...lines.map((l) => textWidth(l, TITLE_FONT)));
  const inset = n.kind === "review" ? HEX : 0;
  sizes.set(n.id, {
    idWidth,
    lines,
    tags,
    inset,
    width: Math.ceil(inner) + 2 * (PAD_X + inset),
    height: 2 * PAD_Y + lines.length * LINE + (tags.length ? TAG_GAP + TAG_H : 0) - 4,
  });
}

// --- layout ------------------------------------------------------------------

function badgeLabel(parentId) {
  return `▸ ${parentId} · ${childrenOf.get(parentId).length} sub-tickets`;
}

// Sub-tickets that no sibling depends on: the bottom of their box.
function boxSinks(parentId) {
  const kids = childrenOf.get(parentId);

}

  for (const e of edges) {
    if (!childrenOf.has(e.v) || phaseOf.get(e.v) !== phaseOf.get(e.w) || !endsPhase(e.w)) continue;
    for (const k of boxSinks(e.v)) if (!g.hasEdge(k, e.w)) g.setEdge(k, e.w);
  }
  // dagre allows no edge to a cluster: hidden edges to each child keep the box under its parent.
  for (const [parentId, kids] of childrenOf) {
    for (const k of kids) if (!g.hasEdge(parentId, k)) g.setEdge(parentId, k);
  }

  // A hidden gate between each pair of phases, fed only by the sinks of the phase above and
  // feeding only the sources of the phase below, keeps every band strictly below the previous.
  const layoutEdges = g.edges();
  const phases = [...new Set(phaseOf.values())].sort((a, b) => a - b);
  const ends = (phase, out) =>
    g
      .nodes()
      .filter(
        (v) =>
          phaseOf.get(v) === phase &&
          !v.endsWith("/sub") &&
          !layoutEdges.some((e) => (out ? e.v : e.w) === v && phaseOf.get(out ? e.w : e.v) === phase),
      );
  phases.slice(1).forEach((next, i) => {
    const gate = `gate/${i}`;
    g.setNode(gate, { width: 2, height: 2 });
    for (const v of ends(phases[i], true)) g.setEdge(v, gate);
    for (const v of ends(next, false)) g.setEdge(gate, v);
  });

  dagre.layout(g);
  const nodes = new Map();
  for (const v of g.nodes()) if (phaseOf.has(v) || junctions.has(v)) nodes.set(v, g.node(v));
  for (const e of drawn) e.inner = g.edge(e.v, e.w).points.slice(1, -1);
  const base = { nodes, phaseOf, phases, drawn, backEdges, height: g.graph().height };
  alignPhases(base, g.graph().marginx);
  base.maxGap = Math.max(...gapsOf(base).map(([top, bottom]) => bottom - top));
  return base;
}

// Every phase starts at the left edge: dagre centres each rank on the widest one, which leaves a
// narrow phase floating far from its label.
function alignPhases(base, margin) {
  const { nodes, phaseOf, phases, drawn } = base;
  const bands = phases.map(() => ({ left: Infinity, top: Infinity, bottom: -Infinity }));
  for (const [v, p] of phaseOf) {
    const box = nodes.get(v);
    const band = bands[phases.indexOf(p)];
    band.left = Math.min(band.left, box.x - box.width / 2);
    band.top = Math.min(band.top, box.y - box.height / 2);
    band.bottom = Math.max(band.bottom, box.y + box.height / 2);
  }
  const points = drawn.flatMap((e) => e.inner);
  for (const p of points) {
    const band = bands.find((b) => p.y >= b.top && p.y <= b.bottom);
    if (band) band.left = Math.min(band.left, p.x);
  }
  // Between two bands the shift blends from one to the other, so edges crossing the gap stay joined.
  const shiftAt = (y) => {
    const i = bands.findIndex((b) => y <= b.bottom);
    if (i === -1) return margin - bands[bands.length - 1].left;
    const b = bands[i];
    if (y >= b.top || i === 0) return margin - b.left;
    const a = bands[i - 1];
    return margin - a.left + ((y - a.bottom) / (b.top - a.bottom)) * (a.left - b.left);
  };
  for (const box of nodes.values()) box.x += shiftAt(box.y);
  for (const p of points) p.x += shiftAt(p.y);
  let right = 0;
  for (const box of nodes.values()) right = Math.max(right, box.x + box.width / 2);
  for (const p of points) right = Math.max(right, p.x);
  base.width = Math.ceil(right + margin);
}

// Vertical gaps between the boxes and tickets of a view, top to bottom.
function gapsOf(view) {
  const spans = [...view.phaseOf.keys()]
    .map((v) => view.nodes.get(v))
    .map((box) => [box.y - box.height / 2, box.y + box.height / 2])
    .sort((a, b) => a[0] - b[0]);
  const gaps = [];
  let end = spans[0][1];
  for (const [top, bottom] of spans) {
    if (top > end) gaps.push([end, top]);
    end = Math.max(end, bottom);
  }
  return gaps;
}

function foldView(base, foldSet) {
  const hiddenIn = (id) => (tickets.has(id) && foldSet.has(tickets.get(id).parent) ? tickets.get(id).parent : null);
  const visible = (id) => (hiddenIn(id) ? `${hiddenIn(id)}/badge` : id);
  const nodes = new Map();
  const phaseOf = new Map();
  for (const [v, box] of base.nodes) {
    if (hiddenIn(v)) continue;
    let copy = { ...box };
    let id = v;
    if (box.box && foldSet.has(box.box)) {
      const height = 2 * PAD_Y + LINE - 4;
      const width = Math.ceil(textWidth(badgeLabel(box.box), ID_FONT)) + 2 * PAD_X;
      id = `${box.box}/badge`;
      copy = { badge: box.box, x: box.x, y: box.y - box.height / 2 + height / 2, width, height };
    }
    nodes.set(id, copy);
    if (base.phaseOf.has(v)) phaseOf.set(id, base.phaseOf.get(v));
  }
  const seen = new Set();
  const copyEdge = (e) => {
    const v = visible(e.v);
    const w = visible(e.w);
    if (v === w || seen.has(`${v}>${w}`)) return null;
    seen.add(`${v}>${w}`);
    const cut = [e.v, e.w].filter(hiddenIn).map((id) => base.nodes.get(`${hiddenIn(id)}/sub`));
    const inside = (p) => cut.some((b) => Math.abs(p.x - b.x) <= b.width / 2 && Math.abs(p.y - b.y) <= b.height / 2);
    return { ...e, v, w, inner: (e.inner || []).filter((p) => !inside(p)).map((p) => ({ ...p })) };
  };
  const view = {
    nodes,
    phaseOf,
    phases: base.phases,
    drawn: base.drawn.map(copyEdge).filter(Boolean),
    backEdges: base.backEdges.map(copyEdge).filter(Boolean),
    width: base.width,
  };

  // A gap taller than the tallest one of the unfolded layout was left by a folded box: shrink it.
  const cuts = gapsOf(view).filter(([top, bottom]) => bottom - top > base.maxGap);
  const mapY = (y) => {
    let lift = 0;
    for (const [top, bottom] of cuts) {
      if (y >= bottom) lift += bottom - top - base.maxGap;
      else if (y > top) lift += (y - top) * (1 - base.maxGap / (bottom - top));
    }
    return y - lift;
  };
  for (const box of nodes.values()) box.y = mapY(box.y);
  for (const e of view.drawn) for (const p of e.inner) p.y = mapY(p.y);
  view.height = mapY(base.height);

  view.bands = base.phases.map((phase) => {
    const spans = [...phaseOf].filter(([, p]) => p === phase).map(([v]) => nodes.get(v));
    return {
      phase,
      top: Math.min(...spans.map((b) => b.y - b.height / 2)),
      bottom: Math.max(...spans.map((b) => b.y + b.height / 2)),
    };
  });
  routeEdges(view);
  return view;
}

// Edges leave a node from its bottom and enter it at its top, each at its own port, ordered by
// where the edge comes from, so arrows do not pile onto one point.
function routeEdges(view) {
  const { nodes, drawn } = view;
  const ports = new Map();
  const port = (v, out, edge, x) => {
    const key = `${out ? "out" : "in"} ${v}`;
    if (!ports.has(key)) ports.set(key, { v, out, list: [] });
    ports.get(key).list.push({ edge, x });
  };
  for (const e of drawn) {
    const a = nodes.get(e.v);
    const b = nodes.get(e.w);
    if (!e.inner.length) e.inner = [{ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }];
    if (!e.v.startsWith("join/")) port(e.v, true, e, e.inner[0].x);
    if (!e.w.startsWith("join/")) port(e.w, false, e, e.inner[e.inner.length - 1].x);
  }
  for (const { v, out, list } of ports.values()) {
    const box = nodes.get(v);
    const span = Math.max(box.width - 2 * ((box.inset || 0) + 8), 0);
    const step = list.length > 1 ? Math.min(PORT_GAP, span / (list.length - 1)) : 0;
    list.sort((a, b) => a.x - b.x);
    list.forEach((p, i) => {
      const x = box.x + (i - (list.length - 1) / 2) * step;
      if (out) p.edge.start = { x, y: box.y + box.height / 2 };
      else p.edge.end = { x, y: box.y - box.height / 2 };
    });
  }
  for (const e of drawn) {
    const pts = e.start ? [e.start, { x: e.start.x, y: e.start.y + STUB }] : [nodes.get(e.v)];
    pts.push(...e.inner);
    pts.push(...(e.end ? [{ x: e.end.x, y: e.end.y - STUB }, e.end] : [nodes.get(e.w)]));
    e.points = pts;
  }
}

let baseLayout = null;
function layout() {
  baseLayout ||= layoutAll();
  return foldView(baseLayout, folded);
}

// --- drawing -----------------------------------------------------------------

function curve(points) {
  let d = `M${points[0].x},${points[0].y}`;
  for (let i = 1; i < points.length - 1; i++) {
    const p = points[i];
    const q = points[i + 1];
    d += ` Q${p.x},${p.y} ${(p.x + q.x) / 2},${(p.y + q.y) / 2}`;
  }
  const last = points[points.length - 1];
  return `${d} L${last.x},${last.y}`;
}

// Graph nodes and fold controls are SVG groups, so they need the button role and keys by hand.
function asButton(el, label, action) {
  el.setAttribute("tabindex", "0");
  el.setAttribute("role", "button");
  el.setAttribute("aria-label", label);
  el.addEventListener("click", action);
  el.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    ev.preventDefault();
    action();
  });
}

// Returns the phase labels in their own group: render() puts it above the graph and
// stickLabels() keeps it at the left edge of the scroll area.
function drawBands(svg, bands) {
  const layer = svgEl("g", { class: "bands" }, svg);
  const labels = svgEl("g", {});
  bands.forEach((band, i) => {
    const top = i === 0 ? 0 : (bands[i - 1].bottom + band.top) / 2;
    const bottom = i === bands.length - 1 ? null : (band.bottom + bands[i + 1].top) / 2;
    // Width and the last band's height are percentages so the lanes fill the scroll area even when
    // the graph is smaller than the window.
    svgEl(
      "rect",
      {
        class: i % 2 ? "band odd" : "band",
        x: 0,
        y: top,
        width: "100%",
        height: bottom === null ? "100%" : bottom - top,
      },
      layer,
    );
    if (i) svgEl("line", { class: "band-rule", x1: 0, x2: "100%", y1: top, y2: top }, layer);
    const label = svgEl("text", { class: i % 2 ? "phase-label odd" : "phase-label", x: 20, y: top + 26 }, labels);
    label.textContent = `Phase ${band.phase}`;
  });
  return labels;
}

function stickLabels() {
  phaseLabels.setAttribute("transform", `translate(${graphArea.scrollLeft},0)`);
}

function drawBox(layer, parentId, box) {
  const x = box.x - box.width / 2;
  const y = box.y - box.height / 2;
  svgEl("rect", { class: "box", x, y, width: box.width, height: box.height, rx: 10 }, layer);
  const header = svgEl("g", { class: "box-header", "aria-expanded": "true" }, layer);
  svgEl("rect", { x, y, width: box.width, height: HEADER, fill: "transparent" }, header);
  svgEl("rect", { class: "ring", x: x + 2, y: y + 2, width: box.width - 4, height: HEADER - 2, rx: 8 }, header);
  const label = svgEl("text", { x: x + 12, y: y + 16 }, header);
  label.textContent = `▾ ${parentId} sub-tickets`;
  const title = svgEl("title", {}, header);
  title.textContent = "Fold";
  asButton(header, `Fold ${parentId} sub-tickets`, () => toggleFold(parentId));
  foldEls.set(parentId, header);
}

function drawBadge(layer, parentId, box) {
  const grp = svgEl(
    "g",
    {
      class: "badge",
      transform: `translate(${box.x - box.width / 2},${box.y - box.height / 2})`,
    },
    layer,
  );
  grp.setAttribute("aria-expanded", "false");
  svgEl("rect", { class: "ring", x: -4, y: -4, width: box.width + 8, height: box.height + 8, rx: 11 }, grp);
  svgEl("rect", { class: "face", width: box.width, height: box.height, rx: 8 }, grp);
  const label = svgEl("text", { x: PAD_X, y: box.height / 2 + 4 }, grp);
  label.textContent = badgeLabel(parentId);
  const title = svgEl("title", {}, grp);
  title.textContent = "Unfold";
  asButton(grp, `Unfold: ${label.textContent}`, () => toggleFold(parentId));
  foldEls.set(parentId, grp);
}

function shapePoints(width, height, grow) {
  const h = HEX + grow / 2;
  return [
    [h - grow, -grow],
    [width - h + grow, -grow],
    [width + grow, height / 2],
    [width - h + grow, height + grow],
    [h - grow, height + grow],
    [-grow, height / 2],
  ]
    .map((p) => p.join(","))
    .join(" ");
}

function drawNode(layer, n, box) {
  const { width, height, lines, tags, inset, idWidth } = box;
  const grp = svgEl(
    "g",
    {
      class: "node",
      transform: `translate(${box.x - width / 2},${box.y - height / 2})`,
    },
    layer,
  );
  paintStatus(grp, n.status);
  if (n.kind === "review") {
    svgEl("polygon", { class: "ring", points: shapePoints(width, height, 4) }, grp);
    svgEl("polygon", { class: "shape", points: shapePoints(width, height, 0) }, grp);
  } else {
    svgEl("rect", { class: "ring", x: -4, y: -4, width: width + 8, height: height + 8, rx: 10 }, grp);
    svgEl("rect", { class: "shape", width, height, rx: 6 }, grp);
  }
  const x0 = PAD_X + inset;
  const titleX = x0 + idWidth + ID_GAP;
  const id = svgEl("text", { class: "id", x: x0, y: PAD_Y + 12 }, grp);
  id.textContent = n.id;
  lines.forEach((line, i) => {
    const text = svgEl("text", { class: "label", x: titleX, y: PAD_Y + 12 + i * LINE }, grp);
    text.textContent = line;
  });
  let tagX = titleX;
  const tagY = PAD_Y + lines.length * LINE + TAG_GAP - 4;
  for (const t of tags) {
    const tag = svgEl("g", { class: "tag" }, grp);
    tag.style.setProperty("--hue", tagHue.get(t.tag) ?? 0);
    svgEl("rect", { x: tagX, y: tagY, width: t.width, height: TAG_H, rx: TAG_H / 2 }, tag);
    svgEl("circle", { cx: tagX + 7 + DOT / 2, cy: tagY + TAG_H / 2, r: DOT / 2 }, tag);
    const text = svgEl("text", { x: tagX + 7 + DOT + 4, y: tagY + 12 }, tag);
    text.textContent = t.tag;
    tagX += t.width + 4;
  }
  grp.addEventListener("mouseenter", (ev) => showPreview(n.id, ev));
  grp.addEventListener("mousemove", movePreview);
  grp.addEventListener("mouseleave", hidePreview);
  asButton(grp, `${n.id} ${n.title}, ${n.status}`, () => selectTicket(n.id));
  nodeEls.set(n.id, grp);
}

function render() {
  const view = layout();
  const { nodes } = view;
  const svg = svgEl("svg", { width: view.width + GUTTER, height: Math.ceil(view.height), class: "graph" });

  const defs = svgEl("defs", {}, svg);
  const markers = new Map();
  for (const e of [...view.drawn, ...view.backEdges]) {
    if (e.branch || markers.has(e.color)) continue;
    const id = `arrow-${markers.size}`;
    markers.set(e.color, id);
    const marker = svgEl(
      "marker",
      {
        id,
        viewBox: "0 0 10 10",
        refX: 9,
        refY: 5,
        markerWidth: 7,
        markerHeight: 7,
        markerUnits: "userSpaceOnUse",
        orient: "auto",
      },
      defs,
    );
    const head = svgEl("path", { class: "arrow", d: "M1,1 L9,5 L1,9 z" }, marker);
    head.style.setProperty("--c", e.color);
  }

  phaseLabels = drawBands(svg, view.bands);
  const graphLayer = svgEl("g", { transform: `translate(${GUTTER},0)` }, svg);
  const boxLayer = svgEl("g", {}, graphLayer);
  const edgeLayer = svgEl("g", {}, graphLayer);
  const nodeLayer = svgEl("g", {}, graphLayer);

  for (const parentId of childrenOf.keys()) {
    const from = nodes.get(parentId);
    const to = nodes.get(folded.has(parentId) ? `${parentId}/badge` : `${parentId}/sub`);
    svgEl(
      "path",
      {
        class: "connector",
        d: `M${from.x},${from.y + from.height / 2} L${to.x},${to.y - to.height / 2}`,
      },
      edgeLayer,
    );
  }
  const edgePath = (e, d) => {
    const path = svgEl("path", { class: "edge", d }, edgeLayer);
    path.style.setProperty("--c", e.color);
    if (!e.branch) path.setAttribute("marker-end", `url(#${markers.get(e.color)})`);
  };
  for (const e of view.drawn) edgePath(e, curve(e.points));
  for (const e of view.backEdges) {
    const a = nodes.get(e.v);
    const b = nodes.get(e.w);
    const ay = a.y - a.height / 2;
    const by = b.y + b.height / 2;
    edgePath(e, `M${a.x},${ay} C${a.x},${ay - 60} ${b.x},${by + 60} ${b.x},${by}`);
  }

  nodeEls.clear();
  foldEls.clear();
  for (const box of nodes.values()) {
    if (box.box) drawBox(boxLayer, box.box, box);
    else if (box.badge) drawBadge(nodeLayer, box.badge, box);
    else if (box.ticket) drawNode(nodeLayer, tickets.get(box.ticket), box);
  }
  svg.append(phaseLabels);
  graphArea.replaceChildren(svg);
  stickLabels();
  markSelected();
}

// --- preview -----------------------------------------------------------------

const preview = htmlEl("div");
preview.id = "preview";

function showPreview(id, ev) {
  const n = tickets.get(id);
  const st = statusOf(n.status);
  const head = htmlEl("div", "preview-head");
  head.append(htmlEl("code", "", n.id), htmlEl("strong", "", n.title));
  const status = htmlEl("div", "");
  status.append(statusChip(n.status), document.createTextNode(` ${st.meaning}`));
  preview.replaceChildren(
    head,
    status,
    htmlEl("div", "meta", `phase ${n.phase} · holder ${n.holder || "—"} · tags ${n.tags.join(", ") || "—"}`),
    htmlEl("p", "", goalExcerpt(id)),
  );
  preview.hidden = false;
  hovered = { id, x: ev.clientX, y: ev.clientY };
  movePreview(ev);
}

// The preview follows the pointer sideways but sits below or above the node, never over it.
function movePreview(ev) {
  if (!hovered) return;
  Object.assign(hovered, { x: ev.clientX, y: ev.clientY });
  const node = nodeEls.get(hovered.id).getBoundingClientRect();
  const width = preview.offsetWidth;
  const height = preview.offsetHeight;
  const gap = 8;
  let x = Math.max(Math.min(ev.clientX - width / 2, innerWidth - width - gap), gap);
  let y;
  if (node.bottom + gap + height <= innerHeight - gap) y = node.bottom + gap;
  else if (node.top - gap - height >= gap) y = node.top - gap - height;
  else {
    x = node.right + gap + width <= innerWidth - gap ? node.right + gap : Math.max(node.left - gap - width, gap);
    y = Math.max(Math.min(node.top, innerHeight - height - gap), gap);
  }
  preview.style.left = `${x}px`;
  preview.style.top = `${y}px`;
}

function hidePreview() {
  hovered = null;
  preview.hidden = true;
}

// --- drawer ------------------------------------------------------------------

const drawer = htmlEl("aside");
drawer.id = "drawer";

function ticketLink(id) {
  if (!tickets.has(id)) return htmlEl("span", "", id);
  const link = htmlEl("button", "link", id);
  link.type = "button";
  link.addEventListener("click", () => selectTicket(id));
  return link;
}

function openDrawer(id) {
  const n = tickets.get(id);
  const t = data.tickets[id];
  const head = htmlEl("div", "drawer-head");
  const close = htmlEl("button", "close", "×");
  close.type = "button";
  close.title = "Close (Esc)";
  close.setAttribute("aria-label", "Close");
  close.addEventListener("click", closeDrawer);
  head.append(htmlEl("code", "drawer-id", n.id), htmlEl("h2", "", n.title), statusChip(n.status), close);

  const meta = htmlEl("dl");
  const row = (label, ...values) => {
    const dd = htmlEl("dd");
    if (values.length) dd.append(...values);
    else dd.textContent = "—";
    meta.append(htmlEl("dt", "", label), dd);
  };
  const codes = (items) => items.map((s) => htmlEl("code", "", s));
  row("kind", n.kind);
  row("phase", String(n.phase));
  row("status", `${n.status} — ${statusOf(n.status).meaning}`);
  row("holder", ...(n.holder ? [htmlEl("code", "", n.holder)] : []));
  row("tags", ...n.tags.map(tagChip));
  row("files", ...codes(n.files));
  row("verify", ...codes(t.verify ? [t.verify] : []));
  row("depends_on", ...t.depends_on.map(ticketLink));
  row("parent", ...(n.parent ? [ticketLink(n.parent)] : []));
  row("children", ...(childrenOf.get(id) || []).map(ticketLink));
  const ext = n.external;
  if (ext) {
    const label = `${ext.system}:${ext.id}`;
    if (ext.url && safeHref(ext.url)) {
      const a = htmlEl("a", "", label);
      a.href = ext.url;
      a.target = "_blank";
      a.rel = "noopener";
      row("external", a);
    } else {
      row("external", label);
    }
  } else {
    row("external");
  }
  row("updated", n.updated);
  row("path", ...codes([n.path]));

  drawer.replaceChildren(head, meta);
  for (const name of data.sections) {
    const body = t.sections[name];
    if (!body || !body.trim()) continue;
    const section = htmlEl("section", "md");
    section.innerHTML = md.parse(body);
    drawer.append(htmlEl("h3", "", name), section);
  }
  drawer.hidden = false;
}

function closeDrawer() {
  selected = null;
  saveState();
  drawer.hidden = true;
  markSelected();
}

function markSelected() {
  for (const [id, el] of nodeEls) el.classList.toggle("selected", id === selected);
}

// Scroll the graph only as far as needed to show the node whole, beside the drawer.
function reveal(id) {
  const el = nodeEls.get(id);
  if (!el) return;
  const node = el.getBoundingClientRect();
  const view = graphArea.getBoundingClientRect();
  const pad = 24;
  let dx = 0;
  let dy = 0;
  if (node.left < view.left + pad || node.right > view.right - pad) {
    dx = node.left + node.width / 2 - (view.left + view.width / 2);
  }
  if (node.top < view.top + pad || node.bottom > view.bottom - pad) {
    dy = node.top + node.height / 2 - (view.top + view.height / 2);
  }
  if (dx || dy) graphArea.scrollBy({ left: dx, top: dy, behavior: "smooth" });
}

function selectTicket(id) {
  const parentId = tickets.get(id).parent;
  if (folded.has(parentId)) {
    folded.delete(parentId);
    render();
  }
  selected = id;
  markSelected();
  openDrawer(id);
  drawer.scrollTop = 0;
  reveal(id);
  saveState();
}

function toggleFold(parentId) {
  const refocus = document.activeElement === foldEls.get(parentId);
  if (folded.has(parentId)) folded.delete(parentId);
  else folded.add(parentId);
  hidePreview();
  render();
  if (refocus) foldEls.get(parentId).focus();
  saveState();
}

// --- view state --------------------------------------------------------------

// file:// pages can re-read their data only by reloading, so the view state lives in the URL
// hash; sessionStorage behaves differently on file:// between browsers. The hover keys are
// written only for a reload. A reload loads the URL it started with, so a change made while one is
// in flight (an Esc, a click) starts it again with the new hash.
let reloading = false;
function saveState(withHover) {
  const params = new URLSearchParams();
  if (selected) params.set("sel", selected);
  if (folded.size) params.set("fold", [...folded].sort().join(","));
  params.set("x", Math.round(graphArea.scrollLeft));
  params.set("y", Math.round(graphArea.scrollTop));
  if (selected) params.set("d", Math.round(drawer.scrollTop));
  if ((withHover || reloading) && hovered) {
    params.set("hov", hovered.id);
    params.set("px", Math.round(hovered.x));
    params.set("py", Math.round(hovered.y));
  }
  history.replaceState(null, "", `#${params}`);
  if (reloading) location.reload();
}

function applyState(state, first) {
  const fold = new Set((state.get("fold") || "").split(",").filter((p) => childrenOf.has(p)));
  if (first || fold.size !== folded.size || [...fold].some((p) => !folded.has(p))) {
    folded = fold;
    render();
  }
  const sel = tickets.has(state.get("sel")) ? state.get("sel") : null;
  const changed = sel !== selected;
  selected = sel;
  markSelected();
  if (sel) {
    if (changed || first) openDrawer(sel);
    drawer.scrollTop = Number(state.get("d")) || 0;
  } else {
    drawer.hidden = true;
  }
  if (state.has("x") || state.has("y")) {
    graphArea.scrollTo(Number(state.get("x")) || 0, Number(state.get("y")) || 0);
  } else if (sel && changed) {
    reveal(sel);
  }
}

function restoreHover(state) {
  const id = state.get("hov");
  const x = Number(state.get("px"));
  const y = Number(state.get("py"));
  if (!nodeEls.has(id) || !document.elementFromPoint) return;
  const under = document.elementFromPoint(x, y);
  if (under && nodeEls.get(id).contains(under)) showPreview(id, { clientX: x, clientY: y });
}

// --- start -------------------------------------------------------------------

const graphArea = htmlEl("main");
preview.hidden = true;
drawer.hidden = true;
document.body.prepend(renderHeader(), graphArea, drawer, preview);
history.scrollRestoration = "manual";
graphArea.addEventListener("scroll", stickLabels);
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !drawer.hidden) closeDrawer();
});
addEventListener("hashchange", () => applyState(new URLSearchParams(location.hash.slice(1)), false));
const initial = new URLSearchParams(location.hash.slice(1));
applyState(initial, true);
restoreHover(initial);
saveState();

setInterval(() => {
  if (document.hidden || String(getSelection()) !== "") return;
  reloading = true;
  saveState(true);
}, 5000);
;
